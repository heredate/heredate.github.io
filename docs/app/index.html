<style>
/* ───────── Hereda+ · sistema de diseño v8 «Despacho» ─────────
   Un único juego de tokens. Los nombres semánticos (--bg, --surface, --ink-1, --brand, --success…) son la fuente;
   los nombres históricos (--canvas, --panel, --label, --accent, --gold, --green…) son alias para los módulos.
   Tema grafito en :root; tema claro (el habitual en despacho) en :root[data-theme="light"].
   Puntos de corte (no admiten variables en @media): 390 móvil · 760 tableta · 1024 escritorio con barra lateral · 1280 · 1440. */
:root{
  /* Color semántico · grafito «azul noche»: superficies de azul muy profundo (no gris), tinta fría, azul notarial y petróleo aclarados */
  --bg:#0F1621; --surface:#151E2A; --surface-2:#1A2431; --sunken:#0B111A; --elevated:#1C2735;
  --border:rgba(168,190,222,.11); --border-2:rgba(168,190,222,.2); --border-soft:rgba(168,190,222,.065);
  --ink-1:#E8ECF2; --ink-2:#B3BCC9; --ink-3:#97A1AF; --ink-4:#4C5767; --ink-ph:#727C8B;
  --brand:#9DBCE6; --brand-hover:#B7CEEE; --brand-tint:rgba(157,188,230,.13); --on-brand:#0B1A2E;
  /* En grafito el botón principal es azul notarial pleno con texto blanco (el azul claro queda para enlaces y foco) */
  --btn:#2C5A92; --btn-hover:#34669F; --on-btn:#FFFFFF;
  --petrol:#63B8AF; --petrol-hover:#7CC8C0; --petrol-tint:rgba(99,184,175,.13); --on-petrol:#06201E;
  --success:#63B8AF; --warning:#E0AE68; --danger:#EE8E80; --info:#9DBCE6;
  --success-bg:rgba(99,184,175,.13); --warning-bg:rgba(224,174,104,.14); --danger-bg:rgba(238,142,128,.14); --info-bg:rgba(157,188,230,.12);
  --hover:rgba(168,190,222,.05); --press:rgba(168,190,222,.085);
  --scrim:rgba(3,7,14,.6);
  --shadow-rgb:2,6,14;
  /* Tipografía */
  /* Inter (interfaz) y Source Serif 4 (títulos), autoalojadas y con licencia OFL: igual en Windows, Mac y móvil. Respaldo con métricas ajustadas. */
  --font-sans:"Hereda Sans","Hereda Sans Fallback",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --font-display:"Hereda Serif","Hereda Serif Fallback","Iowan Old Style","Palatino Linotype",Georgia,serif;
  --font-mono:ui-monospace,"SF Mono",SFMono-Regular,Menlo,Consolas,monospace;
  --fs-display:32px; --fs-h1:26px; --fs-h2:17px; --fs-h3:14.5px; --fs-body:14px; --fs-small:13px; --fs-caption:12px; --fs-label:12px;
  --fs-num-xl:26px; --fs-num-lg:20px;
  /* Espacio (rejilla de 4 px) */
  --sp-1:4px; --sp-2:8px; --sp-3:12px; --sp-4:16px; --sp-5:20px; --sp-6:24px; --sp-8:32px; --sp-10:40px; --sp-12:48px;
  /* Radios: chip 6 · control 8 · panel 10 · hoja 14 */
  --r-xs:4px; --r-chip:6px; --r-ctl:8px; --r-panel:10px; --r-sheet:14px; --r-pill:999px;
  /* Sombras: la línea de 1 px hace de borde; la elevación solo en lo que flota */
  --sh-line:0 0 0 1px var(--border);
  --sh-1:0 0 0 1px var(--border),0 1px 2px rgba(2,6,14,.3);
  --sh-2:0 0 0 1px var(--border-2),0 6px 20px -6px rgba(2,6,14,.6);
  --sh-3:0 0 0 1px var(--border-2),0 28px 70px -12px rgba(2,6,14,.7);
  /* Movimiento */
  --ease:cubic-bezier(.32,.72,0,1); --ease-out:cubic-bezier(.2,.8,.2,1); --dur-1:120ms; --dur-2:200ms; --dur-3:320ms;
  /* Estructura */
  --tab:52px; --side:252px; --top:52px; --page-max:1240px;
  /* Gráficos: una familia derivada de la marca (azules, petróleos, pizarra) y un terracota y un bronce para contrastar */
  --c1:#9DBCE6; --c2:#63B8AF; --c3:#9AABC4; --c4:#D9A07A; --c5:#A4AEBB; --c6:#CDB27A; --c7:#A9AEDB;
  --paper:#FFFEFB; --paper-ink:#121C2A;
  /* Marca: el monograma «H+» siempre en azul notarial (en grafito, un punto más claro para que no se hunda en el azul noche) */
  --logo-bg:#1F4573; --logo-ink:#FFFFFF; --logo-acc:#6CC2B8;
  /* Barra lateral: en grafito, el azul noche más profundo; mismo lenguaje que en claro (tinta clara, activo translúcido, filete petróleo) */
  --side-bg:#0A1019; --side-ink:#E8ECF2; --side-ink-2:#B3BCC9; --side-ink-3:#97A1AF; --side-ink-4:#4C5767;
  --side-line:rgba(168,190,222,.11); --side-hover:rgba(168,190,222,.06); --side-active:rgba(168,190,222,.1); --side-field:rgba(168,190,222,.07);
  --side-accent:#6CC2B8; --side-focus:#9DBCE6; --side-btn:#2C5A92; --side-on-btn:#FFFFFF; --side-btn-hover:#34669F;
  --side-logo-bg:#1F4573; --side-logo-ink:#FFFFFF; --side-logo-acc:#6CC2B8;
  /* Títulos de página y cifras grandes: en claro, azul notarial; en grafito, la tinta */
  --ink-title:#E8ECF2;
  color-scheme:dark;

  /* ── Alias históricos (no definir colores nuevos aquí) ── */
  --canvas:var(--bg); --canvas-2:var(--surface-2); --panel:var(--surface); --panel-2:var(--surface-2); --panel-3:var(--sunken); --sidebar:var(--sunken);
  --label:var(--ink-1); --label-2:var(--ink-2); --label-3:var(--ink-3); --label-4:var(--ink-4);
  --hair:var(--border); --hair-2:var(--border-soft); --fill:var(--press); --fill-2:var(--hover); --fill-3:var(--border-2);
  --accent:var(--brand); --accent-hover:var(--brand-hover); --accent-tint:var(--brand-tint); --on-accent:var(--on-brand);
  --gold:var(--success); --gold-tint:var(--success-bg);
  --green:var(--success); --orange:var(--warning); --red:var(--danger); --green-t:var(--success-bg); --orange-t:var(--warning-bg); --red-t:var(--danger-bg);
  --ink:var(--ink-1); --on-ink:var(--bg); 
  --shadow-sm:var(--sh-1); --shadow-md:var(--sh-2); --shadow-lg:var(--sh-3);
  --text:var(--font-sans); --serif:var(--font-sans); --display:var(--font-display);
  --r:var(--r-panel); --r-sm:var(--r-ctl);
  --suc:var(--c4); --plu:var(--c6); --fam:var(--gold);
  --tint-a:12%; --field-a:6%;
  --t-display:var(--fs-display); --t-h1:var(--fs-h1); --t-h2:var(--fs-h2); --t-h3:var(--fs-h3); --t-body:var(--fs-body); --t-small:var(--fs-small); --t-caption:var(--fs-caption); --t-label:var(--fs-label);
}
:root[data-theme="light"]{
  /* Color semántico · claro «notarial»: papel marfil frío, tinta azul-negra, azul notarial para marca y acción,
     petróleo como único acento (selección, avance, dato leído de un documento) y estados con significado */
  --bg:#F4F2EC; --surface:#FFFEFB; --surface-2:#FAF9F5; --sunken:#EBE9E2; --elevated:#FFFEFB;
  --border:#E0DCD2; --border-2:#CBC5B8; --border-soft:#EAE7DF;
  --ink-1:#121C2A; --ink-2:#434C59; --ink-3:#5C6470; --ink-4:#B1B5BC; --ink-ph:#848A93;
  --brand:#0F2B4C; --brand-hover:#0A1F38; --brand-tint:rgba(15,43,76,.07); --on-brand:#FFFFFF;
  --btn:var(--brand); --btn-hover:var(--brand-hover); --on-btn:#FFFFFF;
  --petrol:#1F6E6B; --petrol-hover:#185A57; --petrol-tint:#E5EFEC; --on-petrol:#FFFFFF;
  --success:#1F6E6B; --warning:#875A1A; --danger:#9E3B2B; --info:#2B4D74;
  --success-bg:#E5EFEC; --warning-bg:#F5EDDD; --danger-bg:#F6E8E3; --info-bg:#E8ECF1;
  --hover:rgba(18,28,42,.035); --press:rgba(18,28,42,.06);
  --scrim:rgba(14,24,38,.34);
  --shadow-rgb:18,28,42;
  --sh-1:0 0 0 1px var(--border),0 1px 2px rgba(18,28,42,.04);
  --sh-2:0 0 0 1px var(--border),0 8px 24px -8px rgba(18,28,42,.16);
  --sh-3:0 0 0 1px rgba(18,28,42,.07),0 28px 72px -16px rgba(18,28,42,.28);
  --c1:#0F2B4C; --c2:#1F6E6B; --c3:#46607F; --c4:#9A5B34; --c5:#5E6773; --c6:#7D6436; --c7:#56587E;
  --paper:#FFFFFF; --paper-ink:#121C2A;
  --on-ink:#FFFFFF;
  --logo-bg:#0F2B4C;
  /* Barra lateral en azul notarial: la identidad de la marca. Tinta marfil y azul claro (AA sobre el azul y sobre el activo),
     activo con un velo blanco del 10 % y filete petróleo claro, «Nuevo expediente» en marfil con texto azul, monograma invertido */
  --side-bg:#0F2B4C; --side-ink:#F4F2EC; --side-ink-2:#C3CEDC; --side-ink-3:#A3B4CA; --side-ink-4:#6F86A6;
  --side-line:rgba(255,255,255,.12); --side-hover:rgba(255,255,255,.06); --side-active:rgba(255,255,255,.1); --side-field:rgba(255,255,255,.08);
  --side-accent:#6CC2B8; --side-focus:#9DBCE6; --side-btn:#F4F2EC; --side-on-btn:#0F2B4C; --side-btn-hover:#FFFFFF;
  --side-logo-bg:#F4F2EC; --side-logo-ink:#0F2B4C; --side-logo-acc:#1F6E6B;
  --ink-title:#0F2B4C;
  --tint-a:10%; --field-a:5%;
  color-scheme:light;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%;background:var(--canvas)}
body{margin:0;background:var(--canvas);color:var(--label);font:14.5px/1.5 var(--text);letter-spacing:-.006em;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;min-height:100vh}
:root[data-theme="light"] #app{position:relative;z-index:1}
button,input,select,textarea{font:inherit;color:inherit;letter-spacing:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
a{color:var(--accent);text-decoration:none}
svg{flex:none}
::selection{background:var(--gold-tint)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:8px}
.group :focus-visible,.kpis :focus-visible,.card .group :focus-visible,.heir :focus-visible,.lever :focus-visible,.norma :focus-visible,.tablewrap :focus-visible{outline-offset:-2px}
.num,.fig{font-variant-numeric:lining-nums tabular-nums}
.hide{display:none!important}
.kick{font:500 12.5px/1.3 var(--text);letter-spacing:0;color:var(--label-2)}
.serif{font-family:var(--serif)}

/* ───────── Estructura ───────── */
.shell{min-height:100vh}
.side{display:none}
.main{min-width:0}
@media (min-width:1024px){
  .shell{display:grid;grid-template-columns:var(--side) 1fr}
  .side{display:flex;flex-direction:column;position:sticky;top:0;height:100vh;background:var(--sidebar);-webkit-backdrop-filter:saturate(160%) blur(30px);backdrop-filter:saturate(160%) blur(30px);border-right:.5px solid var(--hair);padding:18px 12px 12px;z-index:5}
}
.side .brandrow{display:flex;align-items:center;gap:10px;padding:4px 8px 16px}
.logo{width:30px;height:30px;border-radius:8px;background:var(--logo-bg);display:grid;place-items:center;color:var(--logo-ink);font:800 13px/1 var(--text);letter-spacing:-.04em;box-shadow:inset 0 0 0 .5px rgba(255,255,255,.18)}
.logo svg{width:19px;height:19px}
.brandname{font:700 17px/1 var(--serif);letter-spacing:-.01em}
.side .search{margin:0 4px 12px}
.side .newbtn{margin:0 4px 14px}
.side .sect{font:600 10.5px/1 var(--text);color:var(--label-3);letter-spacing:.06em;text-transform:uppercase;padding:18px 10px 8px}
.side .scroll{flex:1;overflow:auto;margin:0 -4px;padding:0 4px}
.sitem{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:left;padding:8px 10px;border-radius:9px;transition:background .15s}
.sitem:hover{background:var(--fill-2)}
.sitem[aria-current="true"]{background:var(--fill)}
.sitem .t{min-width:0;flex:1}
.sitem b{display:block;font-weight:500;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:-.005em}
.sitem small{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--label-2);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sitem .ic{width:20px;height:20px;display:grid;place-items:center;color:var(--label-2);margin-top:0}
.sitem[aria-current="true"] .ic{color:var(--label)}
.sitem .ic svg{width:17px;height:17px}
.sitem .cnt{font-size:11.5px;color:var(--label-3);margin-top:2px}
.side .foot{border-top:.5px solid var(--hair);padding-top:10px;display:flex;flex-direction:column;gap:2px}

/* ───────── Barra superior ───────── */
.topbar{position:sticky;top:0;z-index:30;display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:52px;padding:env(safe-area-inset-top) max(12px,env(safe-area-inset-right)) 0 max(12px,env(safe-area-inset-left));background:color-mix(in srgb,var(--canvas) 74%,transparent);-webkit-backdrop-filter:saturate(170%) blur(22px);backdrop-filter:saturate(170%) blur(22px);border-bottom:.5px solid transparent;transition:border-color .2s}
.topbar.scrolled{border-bottom-color:var(--hair)}
.topbar .mid{position:absolute;left:50%;transform:translateX(-50%);font-weight:600;font-size:15px;opacity:0;transition:opacity .2s;white-space:nowrap;max-width:55%;overflow:hidden;text-overflow:ellipsis;pointer-events:none}
.topbar.scrolled .mid{opacity:1}
.tbtn{display:inline-flex;align-items:center;gap:4px;color:var(--label);font-size:15px;min-height:44px;padding:0 8px;border-radius:9px}
.tbtn svg{width:21px;height:21px}
.tbtn:hover{background:var(--fill-2)}
.tbtns{display:flex;align-items:center;gap:2px;margin-left:auto}
.crumbs{display:none}
@media (min-width:1024px){.topbar{padding:0 32px;min-height:58px}.topbar .back-m{display:none}.crumbs{display:flex;gap:8px;align-items:center;font-size:13px;color:var(--label-3)}.crumbs b{color:var(--label);font-weight:500}}

/* ───────── Página ───────── */
.page{max-width:1180px;margin:0 auto;padding:6px 18px calc(var(--tab) + 56px + env(safe-area-inset-bottom))}
.page.narrow{max-width:820px}
@media (min-width:1024px){.page{padding:10px 48px 80px}}
.ltitle{font:700 28px/1.15 var(--serif);letter-spacing:-.022em;margin:6px 0 4px;text-wrap:balance}
@media (min-width:1024px){.ltitle{font-size:30px;letter-spacing:-.02em}}
.ltitle em{font-style:normal;color:var(--label-2)}
.lsub{color:var(--label-2);font-size:14px;margin:4px 0 18px;display:flex;flex-wrap:wrap;gap:4px 12px;align-items:center}
@media (max-width:1023px){.lsub{font-size:13.5px;flex-direction:column;align-items:flex-start;gap:1px}.lsub .sep{display:none}.lsub > span:empty{display:none}}
.lsub .sep{width:3px;height:3px;border-radius:50%;background:var(--label-4)}
.h2{font:600 20px/1.25 var(--serif);letter-spacing:-.015em;margin:40px 0 14px}
.h3{font:600 15.5px/1.3 var(--text);margin:0}
.caption{font-size:13px;color:var(--label-2)}
.foot-note{font-size:12.5px;color:var(--label-3);margin:18px 2px 0;line-height:1.5}

/* Navegación de secciones */
.secnav{display:none}
@media (min-width:1024px){.secnav{display:flex;gap:2px;margin:22px 0 30px;border-bottom:.5px solid var(--hair);position:sticky;top:58px;z-index:20;background:color-mix(in srgb,var(--canvas) 80%,transparent);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px)}
.secnav button{padding:12px 16px 13px;font-size:14px;font-weight:500;color:var(--label-2);position:relative;transition:color .2s}
.secnav button:hover{color:var(--label)}
.secnav button[aria-current="page"]{color:var(--label)}
.secnav button[aria-current="page"]::after{content:"";position:absolute;left:16px;right:16px;bottom:-.5px;height:2px;background:var(--label);border-radius:1px}
.secnav .n{font-size:11px;color:var(--label-3);margin-left:5px}}

/* ───────── Listas agrupadas ───────── */
.group{background:var(--panel);border-radius:var(--r);box-shadow:var(--shadow-sm);overflow:hidden}
.row{display:flex;align-items:center;gap:14px;width:100%;min-height:52px;padding:11px 16px;text-align:left;position:relative;background:none}
button.row,label.row{cursor:pointer;transition:background .12s}
button.row:hover,label.row:hover{background:var(--fill-2)}
button.row:active{background:var(--fill)}
.row + .row::before,.row + .field::before,.field + .row::before,.field + .field::before{content:"";position:absolute;top:0;right:0;left:var(--inset,16px);height:.5px;background:var(--hair)}
.row .t{flex:1;min-width:0}
.row .t b{display:block;font-weight:450;font-size:15.5px;letter-spacing:-.012em;overflow:hidden;text-overflow:ellipsis}
.row .t b.sb{font-weight:600}
.row .t small{display:block;font-size:13px;color:var(--label-2);margin-top:1px}
.row .v{color:var(--label);font-variant-numeric:lining-nums tabular-nums;white-space:nowrap;text-align:right}
@media (min-width:1024px){.row{min-height:48px;padding:10px 16px}.row .t b{font-size:14.5px;letter-spacing:-.006em}.row .t small{font-size:12.5px}}
.row .v.strong{color:var(--label);font-weight:600}
.chev{width:7px;height:12px;color:var(--label-4)}
.ico{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;flex:none;color:var(--label);background:var(--panel-3);box-shadow:inset 0 0 0 .5px var(--hair)}
.ico svg{width:17px;height:17px}
.ico.gray{color:var(--label-2)}.ico.green,.ico.teal{color:var(--c1)}.ico.orange,.ico.brown{color:var(--c4)}.ico.blue{color:var(--c2)}.ico.indigo{color:var(--c5)}.ico.red{color:var(--red)}.ico.gold{color:var(--gold)}
.ico.q{color:var(--label-2)}
.sectitle{font:600 13px/1.3 var(--text);color:var(--label-2);letter-spacing:0;margin:28px 2px 8px}
.sectitle::first-letter{text-transform:uppercase}
.sectitle.flex{display:flex;justify-content:space-between;align-items:baseline;letter-spacing:-.01em;font-size:13.5px;font-weight:400;margin:36px 2px 12px;color:var(--label-2);gap:12px}
.sectitle.flex b{font:600 17px/1.3 var(--serif);letter-spacing:-.015em;color:var(--label)}
.sectitle.flex span{font-size:13.5px;color:var(--label-2)}
.group-foot{font-size:12.5px;color:var(--label-3);margin:8px 16px 0;line-height:1.45}

/* ───────── Botones y controles ───────── */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;min-height:44px;padding:0 22px;border-radius:980px;background:var(--ink);color:var(--on-ink);font-weight:550;font-size:15px;letter-spacing:-.01em;transition:opacity .15s,transform .1s,background .15s;white-space:nowrap}
.btn:hover{opacity:.9}
.btn:active{transform:scale(.98)}
.btn.block{width:100%}
.btn.sm{min-height:34px;padding:0 15px;font-size:13.5px}
@media (min-width:1024px){.btn{min-height:38px;padding:0 18px;font-size:14px}.btn.sm{min-height:32px;padding:0 14px;font-size:13px}.btn svg{width:16px;height:16px}}

/* ───────── Toast ───────── */
.toast{position:fixed;left:50%;top:calc(18px + env(safe-area-inset-top));transform:translateX(-50%);z-index:90;background:color-mix(in srgb,var(--panel-3) 90%,transparent);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);color:var(--label);padding:11px 18px;border-radius:999px;font-size:14px;font-weight:500;box-shadow:var(--shadow-lg);animation:toast .5s var(--ease)}

@keyframes fade{from{opacity:0}to{opacity:1}}

@keyframes push{from{opacity:.4;transform:translateX(26px)}to{opacity:1;transform:none}}
@keyframes grow{from{transform:scaleX(0)}to{transform:none}}

.pk-panel{position:absolute;left:50%;top:14vh;transform:translateX(-50%);width:640px;max-width:calc(100vw - 32px);max-height:min(70vh,640px);display:flex;flex-direction:column;background:var(--panel);color:var(--label);border-radius:14px;box-shadow:var(--shadow-lg),0 0 0 .5px var(--hair);overflow:hidden;animation:pk-pop .12s var(--ease)}
.pk.out .pk-scrim{animation:pk-fade .12s ease reverse forwards}
.pk.out .pk-panel{animation:pk-pop .12s ease reverse forwards}
.pk-head{display:flex;align-items:center;gap:12px;padding:6px 16px 6px 18px;border-bottom:.5px solid var(--hair);color:var(--label-3)}
.pk-head>svg{width:20px;height:20px;flex:none}
.pk-in{flex:1;min-width:0;border:0;background:none;outline:none;height:52px;font:400 18px/1.3 var(--text);letter-spacing:-.01em;color:var(--label)}
.pk-in::placeholder{color:var(--label-3)}
.pk-x{border:.5px solid var(--hair);background:var(--fill-2);color:var(--label-3);font:500 11px/1 var(--text);padding:5px 7px;border-radius:6px;cursor:pointer}
.pk-x:hover{color:var(--label);background:var(--fill)}
.pk-list{flex:1;overflow-y:auto;padding:6px 8px 8px;-webkit-overflow-scrolling:touch;scroll-padding:8px}
.pk-g{font:600 10.5px/1 var(--text);letter-spacing:.06em;text-transform:uppercase;color:var(--label-3);padding:12px 12px 6px}
.pk-g:first-child{padding-top:8px}
.pk-row{display:flex;align-items:center;gap:12px;padding:8px 10px;border-radius:9px;cursor:pointer;min-height:44px;color:var(--label);transition:background .08s}
.pk-row.on{background:var(--accent-tint)}
.pk-row.on .pk-ic{color:var(--accent);background:color-mix(in srgb,var(--accent) 14%,transparent)}
.pk-row.on .pk-hint{opacity:1}
.pk-row.static{cursor:default}
.pk-ic{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;flex:none;background:var(--fill);color:var(--label-2)}
.pk-ic svg{width:17px;height:17px}
.pk-t{flex:1;min-width:0;display:grid;gap:1px}
.pk-t b{font-weight:500;font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pk-t small{font-size:12.5px;color:var(--label-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pk-m{background:none;color:var(--accent);font-weight:600}
.pk-hint{flex:none;display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--label-3);opacity:0;transition:opacity .08s}
.pk-hint kbd,.pk-foot kbd,.pk-keys kbd{font:500 10.5px/1 var(--text);color:var(--label-3);border:.5px solid var(--hair);background:var(--fill-2);border-radius:4px;padding:3px 5px;min-width:10px;text-align:center}
.pk-row .mtag{flex:none}
.pk-keys{display:inline-flex;gap:4px;flex:none}
.pk-foot{display:flex;align-items:center;gap:16px;padding:9px 16px;border-top:.5px solid var(--hair);font-size:12px;color:var(--label-3);background:var(--panel-2)}
.pk-foot span{display:inline-flex;align-items:center;gap:5px}
.pk-foot .pk-brand{margin-left:auto}
.pk-empty{padding:34px 20px;text-align:center;display:grid;gap:6px;color:var(--label-2)}
.pk-empty b{color:var(--label);font-weight:600;font-size:14.5px}
.pk-empty span{font-size:13px;max-width:44ch;margin:0 auto;line-height:1.5}
.pk-help .pk-row .pk-t b{font-weight:400}
.pk-note{margin:10px 12px 4px;font-size:12.5px;color:var(--label-3)}
.pk-hl{outline:2px solid var(--accent);outline-offset:2px;border-radius:14px;transition:outline-color .6s}
/* Botón de acceso «Buscar o hacer… ⌘K» para la barra lateral o superior */
.pk-btn{display:flex;align-items:center;gap:8px;width:100%;height:36px;padding:0 10px;border-radius:10px;background:var(--fill-2);box-shadow:inset 0 0 0 .5px var(--hair-2);color:var(--label-3);font:400 13.5px/1 var(--text);cursor:pointer;text-align:left}
.pk-btn:hover{background:var(--fill);color:var(--label-2)}
.pk-btn>svg{width:16px;height:16px;flex:none}
.pk-btn>span:first-of-type{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pk-btn.tb{width:auto;height:32px;font-size:13px;gap:6px}
.pk-btn.tb>span:first-of-type{display:none}
@media (min-width:760px){.pk-btn.tb>span:first-of-type{display:inline}}
@keyframes pk-fade{from{opacity:0}to{opacity:1}}
@keyframes pk-pop{from{opacity:0;transform:translateX(-50%) translateY(-6px) scale(.985)}to{opacity:1;transform:translateX(-50%) translateY(0) scale(1)}}
/* Móvil: hoja inferior a todo el ancho, apoyada sobre el teclado (--pk-kb la fija visualViewport) */
@media (max-width:640px){
  .pk-panel{left:0;right:0;top:auto;bottom:var(--pk-kb,0px);transform:none;width:auto;max-width:none;max-height:min(78dvh,calc(100dvh - var(--pk-kb,0px) - 24px));border-radius:16px 16px 0 0;padding-bottom:env(safe-area-inset-bottom)}
  .pk-in{height:50px;font-size:17px}
  .pk-foot{display:none}
  .pk-hint kbd{display:none}
  .pk-row.on .pk-hint{opacity:.9}
  @keyframes pk-pop{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
}
@media (prefers-reduced-motion:reduce){.pk-scrim,.pk-panel,.pk.out .pk-scrim,.pk.out .pk-panel{animation:none}.pk-row,.pk-hint{transition:none}}
/* ───────── Diagnóstico del expediente (Piloto 7 · diagnostico.js, prefijo dg-) ───────── */
.dg{--dg-red:var(--red);--dg-amber:var(--orange);--dg-blue:var(--accent);--dg-green:var(--green)}
.dg-ring .bg{stroke:var(--fill)}
.dg-ring .fg{stroke:var(--dg-col,var(--accent));animation:dg-fill 1s var(--ease) both}
@keyframes dg-fill{from{stroke-dashoffset:var(--dg-c)}}
.dg-hero{display:grid;grid-template-columns:auto 1fr auto;gap:26px;align-items:center;padding:26px 28px;overflow:hidden}
.dg-hero::before{content:"";position:absolute;inset:0;background:radial-gradient(520px 200px at 0% 50%,color-mix(in srgb,var(--dg-col,var(--accent)) 9%,transparent),transparent 70%);pointer-events:none}
.dg-hero.nivel-bien{--dg-col:var(--green)}.dg-hero.nivel-atencion{--dg-col:var(--orange)}.dg-hero.nivel-riesgo{--dg-col:var(--red)}
.dg-hero-ring{position:relative;display:grid;place-items:center;flex:none}
.dg-hero-ring svg{display:block}
.dg-score{position:absolute;inset:0;display:grid;place-content:center;text-align:center;pointer-events:none}
.dg-score b{display:block;font:600 40px/1 var(--serif);letter-spacing:-.03em;color:var(--label)}
.dg-score small{display:block;font-size:12px;color:var(--label-2);margin-top:4px}
.dg-hero-ring.sm .dg-score b{font-size:24px}
.dg-hero-t{min-width:0;position:relative}
.dg-hero-t .k{font:500 12.5px/1.3 var(--text);color:var(--label-2);margin-bottom:6px}
.dg-hero-t h2{font:600 30px/1.1 var(--serif);letter-spacing:-.025em;margin:0 0 8px;color:var(--dg-col,var(--label))}
.dg-hero-t p{margin:0;font-size:15px;line-height:1.5;color:var(--label);max-width:62ch}
.dg-hero-meta{display:flex;flex-wrap:wrap;gap:6px 18px;margin-top:14px;font-size:13px;color:var(--label-2)}
.dg-hero-meta span{display:inline-flex;align-items:center;gap:7px}
.dg-hero-acts{display:grid;gap:10px;justify-items:end;align-self:start;position:relative}
.dg-hero-acts .caption{font-size:12px;color:var(--label-3);white-space:nowrap}
.dg-areas{display:grid;grid-template-columns:repeat(6,1fr);gap:12px;margin-top:14px}
.dg-area{display:flex;align-items:center;gap:12px;padding:14px 16px}
.dg-area>div{min-width:0}
.dg-area b{display:block;font-size:13.5px;font-weight:600;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dg-area small{display:block;font-size:12px;color:var(--label-2);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dg-area.off{opacity:.55}
.dg-area .dg-ring{flex:none}
.dg-dot{width:8px;height:8px;border-radius:50%;flex:none;display:inline-block;background:var(--label-4)}
.dg-dot.g3{background:var(--red)}.dg-dot.g2{background:var(--orange)}.dg-dot.g1{background:var(--accent)}.dg-dot.dg-op{background:var(--green)}
.dg-row{display:flex;gap:14px;align-items:flex-start;padding:15px 18px;position:relative}
.dg-row+.dg-row::before{content:"";position:absolute;top:0;left:40px;right:0;height:.5px;background:var(--hair)}
.dg-row .dg-dot{margin-top:7px}
.dg-row.dato .dg-dot{background:var(--accent)}
.dg-t{flex:1;min-width:0}
.dg-t b{display:block;font-size:15px;font-weight:600;letter-spacing:-.012em;line-height:1.35}
.dg-t small{display:block;font-size:13.5px;line-height:1.5;color:var(--label-2);margin-top:3px}
.dg-acc{display:flex;gap:8px;align-items:flex-start;margin-top:8px;font-size:13.5px;line-height:1.5;color:var(--label)}
.dg-arrow{color:var(--label-3);flex:none}
.dg-meta{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center;margin-top:8px;font-size:12px;color:var(--label-3)}
.dg-meta .dg-eur{font-weight:600;color:var(--label);font-variant-numeric:tabular-nums}
.dg-meta .dg-eur.dg-op{color:var(--green)}
.dg-meta .dg-norma{color:var(--label-3)}
.dg-meta .dg-norma .nlink{color:inherit}
.dg-go-w{flex:none;align-self:center}
.dg-go{min-height:32px;padding:0 13px;font-size:13px}
.dg-vacio{margin:6px 4px 0}
.dg-empty{margin-top:14px}
.dg-mini .dg-mini-b{display:flex;gap:18px;align-items:center}
.dg-mini-l{flex:1;min-width:0;display:grid;gap:2px}
.dg-mini-r{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:left;padding:7px 8px;border-radius:10px;background:none;color:var(--label)}
.dg-mini-r:hover{background:var(--fill-2)}
.dg-mini-r .dg-dot{margin-top:6px}
.dg-mini-r span{min-width:0;display:grid}
.dg-mini-r b{font-size:13.5px;font-weight:500;letter-spacing:-.01em;line-height:1.35;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dg-mini-r small{font-size:12px;color:var(--label-2);margin-top:1px}
.card:has(> .card-h [data-sec="diagnostico"]){--sec:var(--c5)}
.page:has(.secnav [data-sec="diagnostico"][aria-current]){--sec:var(--c5)}
@media (max-width:1023px){.dg-areas{grid-template-columns:repeat(3,1fr)}.dg-area{flex-direction:column;align-items:flex-start;gap:10px;padding:12px 12px}.dg-area b,.dg-area small{white-space:normal}}
@media (max-width:760px){
  .dg-hero{grid-template-columns:auto 1fr;gap:16px;padding:20px 18px}
  .dg-hero-acts{grid-column:1/-1;grid-auto-flow:column;justify-content:space-between;justify-items:start;align-items:center}
  .dg-hero-t h2{font-size:24px}
  .dg-score b{font-size:32px}
  .dg-hero-ring svg{width:112px!important;height:112px!important}
  .dg-row{flex-wrap:wrap;padding:14px 14px}
  .dg-go-w{width:100%;padding-left:22px}
  .dg-go-w .btn{width:100%}
  .dg-mini .dg-mini-b{flex-direction:column;align-items:stretch}
  .dg-mini .dg-hero-ring{justify-self:center;margin:0 auto}
}
@media (max-width:420px){.dg-areas{gap:8px}.dg-area{padding:10px}.dg-hero-meta{flex-direction:column;gap:4px}}

/* ───────── Piloto 7 · Modo reunión (rn-) y hoja "Para la familia" ───────── */
.rn-over{position:fixed;inset:0;z-index:80;background:var(--canvas);color:var(--label);display:flex;flex-direction:column;font-family:var(--text);letter-spacing:-.01em;opacity:0;transition:opacity .3s ease;outline:none;overscroll-behavior:contain}
.rn-over.rn-vis{opacity:1}
.rn-prog{position:absolute;top:0;left:0;right:0;height:2px;background:var(--hair)}
.rn-prog i{display:block;height:100%;background:var(--accent);transition:width .45s var(--ease)}
.rn-bar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:calc(12px + env(safe-area-inset-top)) clamp(16px,3vw,40px) 10px;font-size:13.5px;color:var(--label-2);min-height:52px}
.rn-brand{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rn-brand-c{color:var(--label-3)}
.rn-tools{display:flex;gap:6px;flex:none}
.rn-btn{font:500 13.5px/1 var(--text);color:var(--label);background:var(--fill);border:0;border-radius:999px;padding:9px 14px;cursor:pointer;min-height:36px}
.rn-btn:hover{background:var(--fill);filter:brightness(1.06)}
.rn-btn[aria-pressed="true"]{background:var(--label);color:var(--canvas)}
.rn-salir{background:transparent;box-shadow:inset 0 0 0 1px var(--hair)}
.rn-stage{position:relative;flex:1;min-height:0}
.rn-stage::before,.rn-stage::after{content:"";position:absolute;top:0;bottom:0;width:20%;pointer-events:none;opacity:0;transition:opacity .25s;background:linear-gradient(to right,var(--fill-2),transparent)}
.rn-stage::before{left:0}.rn-stage::after{right:0;background:linear-gradient(to left,var(--fill-2),transparent)}
.rn-stage[data-zone="l"]::before,.rn-stage[data-zone="r"]::after{opacity:1}
.rn-stage[data-zone="l"],.rn-stage[data-zone="r"]{cursor:pointer}
.rn-slide{position:absolute;inset:0;overflow:auto;display:flex;padding:clamp(20px,4vh,48px) clamp(18px,6vw,96px);visibility:hidden;opacity:0;transform:translateX(28px);transition:opacity .4s ease,transform .5s var(--ease),visibility 0s .5s;-webkit-overflow-scrolling:touch;scrollbar-width:thin}
.rn-slide.prev{transform:translateX(-28px)}
.rn-slide.on{visibility:visible;opacity:1;transform:none;transition:opacity .45s ease .05s,transform .55s var(--ease) .05s,visibility 0s}
.rn-in{margin:auto;width:100%;max-width:1180px}
.rn-in.rn-center{text-align:center;max-width:960px}
.rn-a{opacity:0;transform:translateY(14px)}
.rn-slide.on .rn-a{animation:rnUp .6s var(--ease) both;animation-delay:calc(.12s + var(--i,0) * .09s)}
@keyframes rnUp{to{opacity:1;transform:none}}
.rn-kick{font:500 clamp(13px,1.1vw,16px)/1.3 var(--text);letter-spacing:.02em;text-transform:uppercase;color:var(--label-2);margin:0 0 14px}
.rn-h1{font:650 clamp(38px,6vw,72px)/1.05 var(--text);letter-spacing:-.03em;margin:0 0 22px;text-wrap:balance}
.rn-h2{font:650 clamp(30px,4vw,54px)/1.08 var(--text);letter-spacing:-.028em;margin:0 0 14px;text-wrap:balance;max-width:34ch}
.rn-lead{font-size:clamp(16px,1.4vw,20px);line-height:1.45;color:var(--label-2);margin:0 0 clamp(18px,3vh,34px);max-width:70ch}
.rn-sub{font-size:clamp(18px,1.8vw,26px);color:var(--label-2);margin:0 0 10px}
.rn-meta{font-size:clamp(14px,1.2vw,17px);color:var(--label-3);margin:0 0 6px}
.rn-made{font-size:13px;color:var(--label-3);margin:36px 0 0}
.rn-eur{display:inline-block;transition:filter .3s}
.rn-over.rn-blur .rn-eur{filter:blur(9px);user-select:none;-webkit-user-select:none}
.rn-foot-s{font-size:clamp(14px,1.15vw,16.5px);color:var(--label-2);margin:22px 0 0;line-height:1.5;max-width:80ch}
/* Quién hereda */
.rn-cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,200px),1fr));gap:clamp(12px,1.4vw,20px)}
.rn-card{background:var(--panel);border-radius:18px;box-shadow:var(--shadow-sm);padding:clamp(18px,2vw,28px);display:flex;flex-direction:column;gap:6px;min-width:0}
.rn-slide.on .rn-card,.rn-slide.on .rn-tile,.rn-slide.on .rn-pay,.rn-slide.on .rn-steps li,.rn-slide.on .rn-docs li{animation:rnUp .55s var(--ease) both;animation-delay:calc(.34s + var(--k,0) * .07s);opacity:0;transform:translateY(10px)}
.rn-card-n{font:650 clamp(20px,1.9vw,28px)/1.15 var(--text);letter-spacing:-.02em;overflow-wrap:anywhere}
.rn-card-r{font-size:clamp(13.5px,1.05vw,15.5px);color:var(--label-2)}
.rn-card-d{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 4px}
.rn-chip{font:500 12.5px/1 var(--text);padding:6px 10px;border-radius:999px;background:var(--fill);color:var(--label-2);white-space:nowrap}
.rn-chip.usufructo{background:var(--accent-tint);color:var(--accent)}
.rn-chip.nuda{background:var(--fill);color:var(--label)}
.rn-chip.leg{background:var(--gold-tint);color:var(--gold)}
.rn-card-v{margin-top:auto;padding-top:12px;font:650 clamp(26px,2.6vw,40px)/1 var(--text);letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.rn-card-v small{display:block;font:400 13px/1.3 var(--text);letter-spacing:0;color:var(--label-3);margin-top:8px}
.rn-notes{display:grid;gap:8px;margin-top:clamp(16px,2.4vh,26px);grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr))}
.rn-notes p{margin:0;font-size:clamp(14px,1.1vw,16px);line-height:1.45;color:var(--label-2);padding:12px 14px;border-radius:12px;background:var(--panel-2);box-shadow:inset 0 0 0 .5px var(--hair)}
.rn-notes b{color:var(--label);font-weight:600}
/* Qué hay */
.rn-split{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(280px,1fr);gap:clamp(20px,3vw,48px);align-items:start}
.rn-tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,200px),1fr));gap:12px}
.rn-tile{background:var(--panel);border-radius:16px;box-shadow:var(--shadow-sm);padding:16px 18px;display:grid;gap:4px;min-width:0}
.rn-tile-i{width:30px;height:30px;border-radius:9px;background:var(--fill);display:grid;place-items:center;color:var(--label-2);margin-bottom:6px}
.rn-tile-i svg{width:18px;height:18px}
.rn-tile b{font-size:clamp(15px,1.2vw,17px);font-weight:600;line-height:1.3;overflow-wrap:anywhere}
.rn-tile small{font-size:13px;color:var(--label-3);line-height:1.35}
.rn-tile-v{font:650 clamp(20px,1.7vw,24px)/1 var(--text);letter-spacing:-.02em;margin-top:8px;font-variant-numeric:tabular-nums}
.rn-formula{background:var(--panel);border-radius:18px;box-shadow:var(--shadow-sm);padding:6px 22px}
.rn-formula>div{display:flex;justify-content:space-between;align-items:baseline;gap:16px;padding:14px 0;border-bottom:.5px solid var(--hair);font-size:clamp(14.5px,1.15vw,17px);color:var(--label-2)}
.rn-formula>div b{font-weight:600;color:var(--label);font-variant-numeric:tabular-nums;white-space:nowrap;font-size:clamp(17px,1.4vw,21px)}
.rn-formula>div.neg b{color:var(--label-2)}
.rn-formula>div.tot{border-bottom:0;padding:18px 0 16px}
.rn-formula>div.tot span{color:var(--label);font-weight:600}
.rn-formula>div.tot b{color:var(--green);font-size:clamp(28px,2.8vw,42px);letter-spacing:-.03em}
/* Qué paga cada uno */
.rn-pays{display:grid;gap:clamp(10px,1.2vh,14px);grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr))}
.rn-pay{background:var(--panel);border-radius:18px;box-shadow:var(--shadow-sm);padding:clamp(14px,1.6vw,22px);display:grid;gap:10px}
.rn-pay-h{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}
.rn-pay-h b{font:650 clamp(18px,1.6vw,24px)/1.2 var(--text);letter-spacing:-.02em}
.rn-pay-h span{color:var(--label-2);font-size:clamp(14px,1.1vw,16px);font-variant-numeric:tabular-nums}
.rn-pbar{display:flex;height:14px;border-radius:8px;overflow:hidden;background:var(--fill)}
.rn-pbar i{display:block;height:100%}
.rn-pbar .g{background:var(--green)}.rn-pbar .a{background:var(--c4)}.rn-pbar .p{background:var(--c6)}
.rn-pay-f{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.rn-pay-f span{display:grid;gap:3px;font:650 clamp(17px,1.5vw,24px)/1.1 var(--text);letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.rn-pay-f small{font:500 12px/1.2 var(--text);letter-spacing:.01em;text-transform:uppercase;color:var(--label-3)}
.rn-pay-f .g{color:var(--green)}.rn-pay-f .a{color:var(--c4)}.rn-pay-f .p{color:var(--c6)}
.rn-pay-s{margin:0;font-size:clamp(14px,1.1vw,16px);color:var(--label-2);line-height:1.4}
/* Qué parte de cada bien */
.rn-scroll{overflow:auto;background:var(--panel);border-radius:18px;box-shadow:var(--shadow-sm)}
.rn-tbl{width:100%;border-collapse:collapse;font-size:clamp(14px,1.1vw,16.5px);min-width:520px}
.rn-tbl th,.rn-tbl td{padding:14px 18px;text-align:right;border-bottom:.5px solid var(--hair);vertical-align:top;font-variant-numeric:tabular-nums;white-space:nowrap}
.rn-tbl th:first-child,.rn-tbl td:first-child{text-align:left;white-space:normal;min-width:180px}
.rn-tbl th{font:600 13px/1.3 var(--text);color:var(--label-2);letter-spacing:.01em}
.rn-tbl td b{font-weight:600}
.rn-tbl td small{display:block;font-size:12.5px;color:var(--label-3);margin-top:2px;white-space:nowrap}
.rn-tbl tr.neg td{color:var(--label-2)}
.rn-tbl .nil{color:var(--label-4)}
.rn-tbl tfoot td{border-bottom:0;font-weight:650;font-size:clamp(15px,1.25vw,19px);color:var(--green)}
.rn-tbl tfoot td:first-child{color:var(--label)}
/* Próximos pasos */
.rn-steps{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.rn-steps li{display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:14px;align-items:center;background:var(--panel);border-radius:16px;box-shadow:var(--shadow-sm);padding:clamp(14px,1.5vh,20px) clamp(16px,1.8vw,24px)}
.rn-step-n{width:40px;height:40px;border-radius:50%;background:var(--accent-tint);color:var(--accent);display:grid;place-items:center;font:650 17px/1 var(--text)}
.rn-step-t{display:grid;gap:3px;min-width:0}
.rn-step-t b{font:600 clamp(16px,1.35vw,20px)/1.3 var(--text);letter-spacing:-.015em}
.rn-step-t small{font-size:clamp(13px,1.05vw,15px);color:var(--label-2)}
.rn-step-c{font:600 13px/1 var(--text);padding:8px 12px;border-radius:999px;background:var(--fill);color:var(--label-2);white-space:nowrap}
.rn-step-c.soon{background:var(--orange-t);color:var(--orange)}
.rn-step-c.late{background:var(--red-t);color:var(--red)}
/* Documentos */
.rn-docs{list-style:none;margin:0;padding:0;display:grid;gap:8px 28px;grid-template-columns:repeat(auto-fit,minmax(min(100%,380px),1fr))}
.rn-docs li{display:flex;gap:14px;align-items:flex-start;padding:12px 0;border-bottom:.5px solid var(--hair)}
.rn-docs li i{width:22px;height:22px;border-radius:7px;border:1.5px solid var(--label-4);flex:none;margin-top:2px}
.rn-docs li span{display:grid;gap:2px;min-width:0}
.rn-docs li b{font:600 clamp(15px,1.25vw,18px)/1.3 var(--text);letter-spacing:-.012em}
.rn-docs li small{font-size:13px;color:var(--label-3)}
.rn-link{margin-top:clamp(18px,3vh,30px);background:var(--panel);border-radius:16px;box-shadow:var(--shadow-sm);padding:18px 22px;display:grid;gap:4px;max-width:720px}
.rn-link b{font-size:clamp(15px,1.2vw,17px)}
.rn-link span{font:500 clamp(15px,1.4vw,20px)/1.3 var(--text);color:var(--accent);overflow-wrap:anywhere}
.rn-link small{font-size:13px;color:var(--label-3)}
/* Pie */
.rn-foot{display:flex;align-items:center;justify-content:center;gap:18px;padding:8px clamp(16px,3vw,40px) calc(10px + env(safe-area-inset-bottom));color:var(--label-3);font:500 13px/1 var(--text);font-variant-numeric:tabular-nums}
.rn-nav{width:40px;height:40px;border-radius:50%;border:0;background:var(--fill);color:var(--label);display:grid;place-items:center;cursor:pointer}
.rn-nav:disabled{opacity:.3;cursor:default}
@media (max-width:900px){.rn-split{grid-template-columns:1fr}.rn-pay-f{grid-template-columns:1fr 1fr 1fr;gap:6px}}
@media (max-width:640px){.rn-slide{padding:14px 16px 20px}.rn-in{margin:0 auto}.rn-in.rn-center{margin:auto}.rn-brand-c,.rn-sep{display:none}.rn-h2{max-width:none}.rn-steps li{grid-template-columns:36px minmax(0,1fr);gap:10px 12px}.rn-step-n{width:32px;height:32px;font-size:14px}.rn-step-c{grid-column:2;justify-self:start}.rn-pay-f span{font-size:16px}.rn-tbl{min-width:460px}}
@media (prefers-reduced-motion:reduce){.rn-over,.rn-over *{animation:none!important;transition:none!important}.rn-a,.rn-slide.on .rn-card,.rn-slide.on .rn-tile,.rn-slide.on .rn-pay,.rn-slide.on .rn-steps li,.rn-slide.on .rn-docs li{opacity:1;transform:none}}
/* Hoja "Para la familia" */
.rn-acts{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-top:16px}

/* ── Dos herencias (segunda.js) ─────────────────────────────── */
.sh-hero{margin:0 0 14px}
.sh-lead{font:400 17px/1.45 var(--serif);letter-spacing:-.01em;color:var(--label);margin:2px 2px 14px;max-width:62ch}
.sh-ctl{display:flex;flex-wrap:wrap;gap:12px 28px;margin-top:14px;padding:14px 18px;border-radius:var(--r);background:var(--panel);box-shadow:var(--shadow-sm)}
.sh-ctl>div{display:flex;flex-direction:column;gap:8px;min-width:0}
.sh-ctl .seg{align-self:flex-start}
.sh-bars{display:grid;gap:12px;margin-top:4px}
.sh-bar{display:grid;grid-template-columns:minmax(150px,220px) 1fr auto;gap:6px 14px;align-items:center;font-size:13.5px}
.sh-bar.best{background:var(--gold-tint);margin:0 -10px;padding:8px 10px;border-radius:10px}
.sh-bn{display:flex;flex-direction:column;gap:4px;min-width:0}
.sh-bn b{font-weight:600;letter-spacing:-.01em}
.sh-bn .tag{align-self:flex-start}
.sh-bt{display:flex;height:22px;border-radius:6px;overflow:hidden;background:var(--fill-2);box-shadow:inset 0 0 0 .5px var(--hair-2)}
.sh-bt i{display:block;height:100%;flex:none;transition:width .35s var(--ease)}
.sh-bt i+i{margin-left:1px}
.sh-bt .i1{background:var(--c4)}.sh-bt .p1{background:var(--c6)}
.sh-bt .i2{background:color-mix(in srgb,var(--c4) 50%,var(--panel))}.sh-bt .p2{background:color-mix(in srgb,var(--c6) 50%,var(--panel))}
.sh-bt .c2{background:repeating-linear-gradient(135deg,color-mix(in srgb,var(--c4) 50%,var(--panel)) 0 4px,var(--panel) 4px 7px)}
.sh-bv{text-align:right;white-space:nowrap}
.sh-bv b{display:block;font:600 16px/1.2 var(--serif);letter-spacing:-.015em}
.sh-bv small{display:block;font-size:12px;color:var(--label-3);margin-top:2px}
.sh-bv small.down,.sh-t td.down{color:var(--green)}.sh-bv small.up,.sh-t td.up{color:var(--orange)}
.sh-leg{margin-top:14px}
.sh-t th small{display:block;font:400 10.5px/1.2 var(--text);letter-spacing:0;text-transform:none;color:var(--label-3);margin-top:2px}
.sh-t td{padding:12px}.sh-t td small{display:block;color:var(--label-3);font-size:12px;margin-top:2px;font-weight:400}
.sh-t tbody tr.on td{background:var(--gold-tint)}
.sh-t tbody tr.on td:first-child b{color:var(--gold)}
.sh-card summary small{white-space:normal;line-height:1.4}
.sh-card .sv small{white-space:normal}
.sh-grid{display:grid;grid-template-columns:1fr;gap:18px}
.sh-grid2{display:grid;grid-template-columns:1fr;gap:18px;margin-top:18px;padding-top:16px;border-top:.5px solid var(--hair)}
@media (min-width:900px){.sh-grid{grid-template-columns:repeat(3,1fr)}.sh-grid2{grid-template-columns:1fr 1fr}}
.sh-h{font:600 11.5px/1.3 var(--text);letter-spacing:.04em;text-transform:uppercase;color:var(--label-3);margin:0 0 8px}
.sh-kv.kv.sm{min-width:0}
.sh-items{display:grid}
.sh-it{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding:7px 0;border-bottom:.5px solid var(--hair-2);font-size:13.5px}
.sh-it:last-child{border-bottom:0}
.sh-it span{display:grid;gap:1px;min-width:0}
.sh-it small{font-size:12px;color:var(--label-3);font-weight:400}
.sh-it b{font-weight:600;font-variant-numeric:lining-nums tabular-nums;white-space:nowrap;text-align:right;display:grid;gap:1px}
.sh-it.dim{color:var(--label-2)}.sh-it.dim b{font-weight:500;color:var(--label-2)}
.sh-it.warn b{color:var(--orange)}
.sh-it.tot{border-top:.5px solid var(--hair);margin-top:2px;padding-top:9px}.sh-it.tot span{font-weight:600}
.sh-r{margin:0;padding:0 0 0 18px;font-size:14px;line-height:1.55}.sh-r li{margin:0 0 8px}
.sh-n{display:inline;font-size:12px;color:var(--label-3)}
.sh-pl{margin:14px 0 0;line-height:1.5}
.sh-empty{margin-top:14px}
.sh-res{text-align:left;width:100%;display:block;cursor:pointer;transition:background .15s}
.sh-res:hover{background:var(--panel-2)}
.sh-res .link{font-size:13.5px}
.sh-res-b .sh-bt{height:14px}
@media (max-width:600px){.sh-bar{grid-template-columns:1fr auto}.sh-bar .sh-bt{grid-column:1/-1;grid-row:2}.sh-ctl{gap:12px}.sh-ctl>div{width:100%}.sh-ctl .seg{align-self:stretch;display:flex}.sh-lead{font-size:16px}}
/* ── Capa de movimiento v7 ── */
/* Las animaciones de shell.html se neutralizan bajo html.mo y se reactivan solo cuando cambia la vista (mo-nav), el paso (mo-step) o se abre una hoja (mo-sheet). */
html.mo .view,html.mo .push,html.mo .pbody,html.mo .sheet,html.mo .scrim,html.mo .gantt .bar,html.mo .hbar .track i{animation:none}
@media (prefers-reduced-motion:no-preference){
  html.mo.mo-nav .view{animation:mo-enter .32s var(--ease) both}
  html.mo.mo-nav .push{animation:push .36s var(--ease) both}
  html.mo.mo-step .pbody{animation:pin .32s var(--ease) both}
  html.mo.mo-sheet .scrim{animation:fade .25s ease both}
  html.mo.mo-sheet .sheet{animation:sheetup .42s var(--ease) both}
  @media (min-width:760px){html.mo.mo-sheet .sheet{animation:pop .3s var(--ease) both}}
  html.mo .scrim.mo-out{animation:mo-fadeout .24s ease both}
  html.mo .sheet.mo-out{animation:mo-sheetdown .26s var(--ease) both}
  @media (min-width:760px){html.mo .sheet.mo-out{animation:mo-popout .2s var(--ease) both}}
  .toast{animation:toast .45s var(--ease),mo-toastout .3s ease 2.05s forwards}
  .mo-b0{transform:scaleX(0);transform-origin:left center}
  .mo-b0.mo-b1{transform:none;transition:transform .6s var(--ease)}
  .ring .fg{transition:stroke-dashoffset .7s var(--ease)}
  .wiz .progress i{transition:width .45s var(--ease)}
}
@keyframes mo-enter{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@keyframes mo-fadeout{to{opacity:0}}
@keyframes mo-sheetdown{to{transform:translateY(100%)}}
@keyframes mo-popout{to{opacity:0;transform:translate(-50%,-49%) scale(.98)}}
@keyframes mo-toastout{to{opacity:0;transform:translate(-50%,-8px)}}
.mo-ghost{pointer-events:none!important;z-index:59}
.sheet.mo-ghost{z-index:60}
@media print{.mo-ghost{display:none!important}}
/* Toast: una línea, centrado con anchura propia (antes se partía en móvil) */
.toast{white-space:nowrap;max-width:calc(100vw - 32px);overflow:hidden;text-overflow:ellipsis}
/* Pulsación: 80 ms, escala .98 en botones y tarjetas; fondo en filas y pestañas */
.btn,.tbtn,.kpi,button.card,.bcard,.ej,.doccard,.fcard,.hpills button,.pnav button,.chips button,.addrow button,.ask,.personal,.altpath,.chip-r,.sitem,.tile{transition:transform .08s ease,background .15s,box-shadow .2s var(--ease),opacity .15s,color .15s}
.btn:active,.tbtn:active,button.kpi:active,button.card:active,.bcard:active,.ej:active,.doccard:active,.fcard:active,.hpills button:active,.chips button:active,.addrow button:active,.ask:active,.personal:active,.chip-r:active{transform:scale(.98)}
.st{transition:all .2s var(--ease),transform .08s ease}
.st:active{transform:scale(.92)}
.tbtn:active,.sitem:active,.seg button:not([aria-pressed="true"]):active,.pnav button:not(.on):active,.stepper button:active,.linkrow:active,.choice:active,.gantt .gr:active,.lanes .ln:active,.grid-t tbody tr:active{background:var(--fill)}
.tabbar button:active,.secnav button:active,.link:active,.stepper button:active,.crumbs button:active{opacity:.6}
.seg button{transition:background .25s var(--ease),color .15s,transform .08s ease}
.seg button:active{transform:scale(.97)}
.lever > summary,.norma > summary,.sitg > summary{transition:background .15s}
.lever > summary:hover,.norma > summary:hover,.sitg > summary:hover{background:var(--fill-2)}
.lever > summary:active,.norma > summary:active,.sitg > summary:active{background:var(--fill)}
/* Elevación coherente al pasar (solo con puntero fino) */
@media (hover:hover) and (pointer:fine){
  button.card:hover,.doccard:hover,.ej:hover,button.kpi:hover,.bcard:hover,.hpills button:hover,.fcard:hover,.ask:hover,.personal:hover,button.altpath:hover{transform:translateY(-1px);box-shadow:var(--shadow-md)}
  button.card:active,.doccard:active,.ej:active,button.kpi:active,.bcard:active,.hpills button:active,.fcard:active,.ask:active,.personal:active{transform:translateY(0) scale(.99);box-shadow:var(--shadow-sm)}
  .ask:hover,.personal:hover,.fcard:hover{background:var(--panel)}
}
/* Foco visible: 2 px de acento a 3 px, igual en todas partes (las listas mantienen el anillo interior) */
:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.btn:focus-visible,.tbtn:focus-visible,.seg button:focus-visible,.chips button:focus-visible,.addrow button:focus-visible,.pnav button:focus-visible{outline-offset:2px}
.field input:focus-visible,.field select:focus-visible,.field textarea:focus-visible,.search input:focus-visible,.inl:focus-visible,.composer textarea:focus-visible{outline:none}
.field:has(> input:focus-visible),.field:has(> select:focus-visible),.field:has(> textarea:focus-visible){box-shadow:inset 2px 0 0 var(--accent)}
.search:has(input:focus-visible){box-shadow:inset 0 0 0 1.5px var(--accent)}
.grid-t tbody tr:focus-visible{outline-offset:-2px}
/* Estados vacíos coherentes: disco tintado, título, una línea, una acción */
.mo-empty{display:flex;flex-direction:column;align-items:center;text-align:center;gap:4px;padding:36px 20px 32px;color:var(--label-2);font-size:14px;line-height:1.5}
.mo-empty .mo-disc{width:52px;height:52px;border-radius:50%;background:var(--accent-tint);color:var(--accent);display:grid;place-items:center;margin-bottom:10px}
.mo-empty .mo-disc svg{width:24px;height:24px}
.mo-empty b{color:var(--label);font:600 17px/1.3 var(--serif);letter-spacing:-.012em}
.mo-empty > span:not(.mo-disc){max-width:44ch;text-wrap:balance}
.mo-empty .btn{margin-top:14px}
.mo-empty.mini{padding:18px 8px 16px;gap:2px;font-size:12.5px;color:var(--label-3)}
.mo-empty.mini .mo-disc{width:34px;height:34px;margin-bottom:6px;background:var(--fill);color:var(--label-3)}
.mo-empty.mini .mo-disc svg{width:16px;height:16px}
.mo-empty.mini b{font-size:13.5px;color:var(--label-2)}
.tablewrap > .mo-empty{border-top:.5px solid var(--hair)}
.card > .mo-empty:only-child{padding:12px 4px 8px}
.board .col > .mo-empty.mini{margin-top:auto;margin-bottom:auto}
/* Números tabulares donde faltaban */
.num,td.n,.kpi b,.amt,.due,.sitem .cnt,.tag,.pc-v b,.pl-s li b,.pt-v,.fx b,.sim-tot b,.mtag,.pi-v b,.pl-t,.fm-h .num,.kv > span:nth-child(even),.trace .l span:last-child,.hbar .vv,.comp .legend span,.tram-head .stats b,.secnav .n,.next .days,.card .big,.card .mid,.hero-save b{font-variant-numeric:lining-nums tabular-nums}
/* Tablas largas: cabecera pegajosa en escritorio ancho; en móvil, scroll horizontal con sombras laterales */
.tablewrap{position:relative;-webkit-overflow-scrolling:touch;scrollbar-width:thin}
@media (min-width:1200px){.tablewrap.card{overflow:visible}.tablewrap .grid-t thead th{position:sticky;top:58px;z-index:2}.page:has(.secnav) .tablewrap .grid-t thead th{top:104px}.tablewrap .grid-t thead th:first-child{border-top-left-radius:var(--r)}.tablewrap .grid-t thead th:last-child{border-top-right-radius:var(--r)}}
.tablewrap.mo-r{-webkit-mask:linear-gradient(90deg,#000 calc(100% - 28px),transparent);mask:linear-gradient(90deg,#000 calc(100% - 28px),transparent)}
.tablewrap.mo-l{-webkit-mask:linear-gradient(90deg,transparent,#000 28px);mask:linear-gradient(90deg,transparent,#000 28px)}
.tablewrap.mo-l.mo-r{-webkit-mask:linear-gradient(90deg,transparent,#000 28px,#000 calc(100% - 28px),transparent);mask:linear-gradient(90deg,transparent,#000 28px,#000 calc(100% - 28px),transparent)}
/* Anclas bajo las barras pegajosas, selección, safe areas */
.pnav,.sectitle,.h2,.phase-h,.card,.group{scroll-margin-top:calc(var(--tab) + 24px)}
@media (min-width:1024px){.pnav,.sectitle,.h2,.phase-h,.card,.group{scroll-margin-top:124px}}
::selection{background:var(--accent-tint);color:inherit}
:root[data-theme="light"] ::selection{background:color-mix(in srgb,var(--brand) 16%,transparent)}
.sheet{padding-left:env(safe-area-inset-left);padding-right:env(safe-area-inset-right)}
.sheet .body{overscroll-behavior:contain;scroll-padding-bottom:24px}
.board,.pnav,.stepper,.tree-wrap{overscroll-behavior-x:contain}
/* Controles: select y date coherentes con los campos */
.field select,.field input[type="date"]{min-height:24px}
input[type="date"]::-webkit-datetime-edit-day-field:focus,input[type="date"]::-webkit-datetime-edit-month-field:focus,input[type="date"]::-webkit-datetime-edit-year-field:focus{background:var(--accent-tint);color:var(--accent);border-radius:3px}
.movform select,.padj{transition:box-shadow .15s}
.movform input:focus-visible,.movform select:focus-visible,.padj:focus-visible,.muni .mopt:focus-visible{outline:none;box-shadow:inset 0 0 0 1.5px var(--accent)}
/* Envoltura en móvil (scroll horizontal de página detectado en Partición › paso 5 y Encargo › Documentación) */
.pfoot{flex-wrap:wrap}
.pfoot .btn{flex:1 1 auto;min-width:0}
@media (max-width:759px){.card:has(> svg.ring){flex-wrap:wrap}.card:has(> svg.ring) > div[style*="margin-left"]{margin-left:0!important;flex-basis:100%}.card:has(> svg.ring) > div .btn{width:100%}}
.sectitle.flex .link{padding:6px 0;margin:-6px 0}
.group-foot,.foot-note{text-wrap:pretty}
/* Esqueleto mientras carga el archivo (los adjuntos llegan tras archivoCargar) */
@keyframes mo-shimmer{to{background-position:-200% 0}}
.mo-skel{border-radius:10px;background:linear-gradient(90deg,var(--fill-2) 25%,var(--fill) 50%,var(--fill-2) 75%);background-size:200% 100%;animation:mo-shimmer 1.1s linear infinite;min-height:44px}
/* Paridad grafito de los módulos P6: un solo borde (el de la sombra), «en revisión» en ámbar */
.pdfbar,.muni .mres,.muni .mcard{border:0;box-shadow:var(--shadow-sm)}
.mtag.rev{background:var(--orange-t);color:var(--orange)}

/* ───────── Control de legítimas (Piloto 7, legitimas.js) ───────── */
.lg .lg-reg{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;color:var(--label-2);text-align:right;flex-wrap:wrap;justify-content:flex-end}

.lg-seg{display:flex;align-items:center;justify-content:center;height:100%;min-width:0;color:#fff;font:600 12px/1 var(--text);font-variant-numeric:tabular-nums}
.lg-seg span{overflow:hidden;white-space:nowrap;text-overflow:ellipsis;padding:0 6px;text-shadow:0 1px 1px rgba(var(--shadow-rgb),.18)}

.lg-sw{display:inline-block;width:11px;height:11px;border-radius:3px;flex:none}
.lg-sw.usu{background:repeating-linear-gradient(-45deg,var(--label-2) 0 2px,transparent 2px 4px);box-shadow:inset 0 0 0 1px var(--label-2)}
.lg-leg{display:flex;flex-wrap:wrap;gap:6px 18px;margin:12px 0 4px;font-size:12.5px;color:var(--label-2)}
.lg-leg span{display:inline-flex;align-items:center;gap:7px}
.lg-leg b{color:var(--label);font-weight:600;margin-left:2px}
.lg-nota{margin:10px 0 0;line-height:1.5}

.rd-row.bad{--rd-c:var(--red)}.rd-row.warn{--rd-c:var(--orange)}.rd-row.info{--rd-c:var(--accent)}.rd-row.mute{--rd-c:var(--label-3)}

.rd-d{display:flex;flex-wrap:wrap;align-items:baseline;gap:2px 8px;margin-top:3px;font-size:12.5px;line-height:1.4;color:var(--label-3);min-width:0}

.rd-det{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100%}
.rd-eur{color:var(--red);font-weight:600;white-space:nowrap}
.rd-days{text-align:right;line-height:1}

.rd-days small{display:block;font-size:11px;color:var(--label-3);margin-top:3px;white-space:nowrap}
.rd-days.bad b{color:var(--red)}.rd-days.warn b{color:var(--orange)}.rd-days.info b{color:var(--accent)}.rd-days.mute b{color:var(--label-2)}
.rd-av{display:flex;justify-content:center}

  .sn-wrap.sn-r .secnav{--snr:64px}
  .sn-ar{position:absolute;top:50%;transform:translateY(-50%);z-index:2;width:30px;height:30px;border-radius:50%;display:none;align-items:center;justify-content:center;background:var(--panel);color:var(--label);box-shadow:0 0 0 .5px var(--hair),var(--shadow-sm);cursor:pointer}
  .sn-ar svg{width:15px;height:15px}
  .sn-ar:hover{color:var(--accent)}
  .sn-izq{left:2px}
  .sn-der{right:2px}
  .sn-wrap.sn-l .sn-izq,.sn-wrap.sn-r .sn-der{display:inline-flex}
}
@media print{.sn-wrap{display:none!important}}
/* H30: cabecera del móvil con texto bajo cada icono */
.tbtn.nu-tb{flex-direction:column;justify-content:center;gap:1px;min-width:52px;min-height:46px;padding:2px 6px;font-size:11px;font-weight:500;color:var(--label-2);position:relative;line-height:1.1}
.tbtn.nu-tb svg{width:21px;height:21px;color:var(--label)}
.tbtn.nu-tb:last-child{color:var(--accent)}
.tbtn.nu-tb:last-child svg{color:var(--accent)}
.nu-tbn{position:absolute;top:2px;right:8px;min-width:16px;height:16px;padding:0 4px;border-radius:8px;background:var(--red);color:var(--on-ink);font-size:10.5px;font-style:normal;font-weight:600;display:inline-flex;align-items:center;justify-content:center}
.nu-cnt{min-width:22px;height:22px;padding:0 6px;border-radius:11px;background:var(--red);color:var(--on-ink);font-size:12px;font-weight:600;display:inline-flex;align-items:center;justify-content:center;margin-right:6px}
.infobar.nu-otro{margin:0 0 14px}
/* H31: territorios con reglas pendientes en el caso habitual */
.row small.nu-pend{color:var(--c4)}
/* H44: IBAN */
.field .hint.nu-err{color:var(--red)}
.field .hint.nu-ok{color:var(--green)}
.field input[aria-invalid="true"]{box-shadow:inset 0 0 0 1px var(--red)}
/* Cronómetro flotante: deja sitio al final de la página para que no tape el último contenido, y en pantallas medianas,
   en reposo, se queda en el icono (el texto aparece al pasar el ratón o con el foco) */
@media (min-width:1024px){body:has(#tm-root:not([hidden])) .main .page{padding-bottom:120px}}
@media (min-width:1024px) and (max-width:1599px){
  .tm-pill.tm-idle .tm-lbl{display:none}
  .tm-pill.tm-idle{padding:0 12px}
  .tm-pill.tm-idle:hover .tm-lbl,.tm-pill.tm-idle:focus-visible .tm-lbl{display:inline}
}
/* H27: presupuesto por completar */
.nu-pcv{display:inline-block;font-size:12px;font-weight:600;color:var(--c4);background:color-mix(in srgb,var(--c4) 12%,transparent);border-radius:6px;padding:1px 7px}
.caption.nu-pc{margin:-4px 0 10px;color:var(--c4)}

/* ── Integrador P10: plusvalía en municipios sin ordenanza incorporada (estimación con el máximo legal) ── */
.mest{display:flex;gap:12px;align-items:flex-start;margin:10px 0 6px;padding:12px 14px;border-radius:12px;background:color-mix(in srgb,var(--gold) 8%,var(--panel));border:1px solid color-mix(in srgb,var(--gold) 26%,var(--hair))}
.mest.on{background:var(--panel-2);border-color:var(--hair)}
.mest > .ico{flex:none}
.mest > div{min-width:0}
.mest b{display:block;font-weight:600;font-size:14px;line-height:1.35}
.mest p{margin:4px 0 8px;font-size:13px;color:var(--label-2);line-height:1.45}
.mest .mest-foral{color:var(--red)}
.mest .btn{margin-top:2px;white-space:normal;max-width:100%;height:auto;min-height:32px;text-align:left}
.mest{margin-left:14px;margin-right:14px}
.plus-est{margin:12px 0 4px}
/* Ajustes › Equipo: nombre, rol y tratamiento */
.abo-g{display:grid;grid-template-columns:1fr 120px 104px;gap:8px;align-items:center}
@media (max-width:560px){.abo-g{grid-template-columns:1fr 1fr}.abo-g input:first-child{grid-column:1/-1}}

/* ───────── Menú «Más» del expediente y resumen plegado (de la capa v6; el resto de v6 lo sustituye v8) ───────── */
/* Pestañas principales + «Más» */
.sn-mas{position:relative}
.sn-mas > button{display:inline-flex;align-items:center;gap:4px}
.sn-mas > button svg{width:12px;height:12px;opacity:.7}
.sn-menu{position:absolute;top:calc(100% + 6px);right:0;min-width:240px;background:var(--panel);border-radius:12px;box-shadow:var(--shadow-lg);padding:6px;z-index:40;display:grid}
.sn-menu button{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;text-align:left;padding:9px 12px;border-radius:8px;font-size:14px;color:var(--label)}
.sn-menu button:hover{background:var(--fill-2)}
.sn-menu button[aria-current="page"]{background:var(--fill);font-weight:600}
.sn-menu button small{color:var(--label-3);font-size:12px}
.sn-menu .sn-h{padding:8px 12px 4px;font:600 11px/1.2 var(--text);letter-spacing:.07em;text-transform:uppercase;color:var(--label-3)}
/* Resumen: lo esencial arriba; el detalle, plegado */
.res-mas{display:flex;justify-content:center;margin:22px 0 6px}
.res-mas button{padding:9px 18px;border-radius:980px;background:var(--panel);box-shadow:var(--shadow-sm);font-size:13.5px;font-weight:500;color:var(--label-2)}
.res-mas button:hover{color:var(--label);box-shadow:var(--shadow-md)}
@media (min-width:760px){.kpis.kpis3{grid-template-columns:repeat(3,1fr)}}
.sn-wrap > .sn-menu{top:calc(100% - 8px);right:0}
@media (max-width:1023px){.sn-wrap > .sn-menu{left:0;right:auto}}

/* ───────── Guías interactivas (guia.js) ───────── */
.gu{position:fixed;inset:0;z-index:4000;pointer-events:none}
.gu-dim{position:absolute;inset:0;width:100%;height:100%}
.gu-dim > rect{fill:rgba(3,7,14,.5)}
:root[data-theme="light"] .gu-dim > rect{fill:rgba(14,24,38,.36)}
.gu-hole{transition:x .25s var(--ease),y .25s var(--ease),width .25s var(--ease),height .25s var(--ease)}
.gu-ring{position:absolute;border-radius:12px;box-shadow:0 0 0 2px var(--panel),0 0 0 4px var(--accent),0 12px 40px -10px rgba(var(--shadow-rgb),.5);transition:all .25s var(--ease);opacity:0}
.gu-card{position:fixed;pointer-events:auto;background:var(--panel);color:var(--label);border-radius:16px;box-shadow:var(--shadow-lg);padding:16px 18px 14px;transition:left .25s var(--ease),top .25s var(--ease)}
.gu-card.gu-abajo{left:12px!important;right:12px!important;bottom:max(12px,env(safe-area-inset-bottom));top:auto!important;width:auto!important}
.gu-k{display:flex;align-items:center;gap:10px;font:600 11.5px/1.3 var(--text);letter-spacing:.07em;text-transform:uppercase;color:var(--label-3)}
.gu-k .num{margin-left:auto;letter-spacing:0;text-transform:none;font-weight:500}
.gu-x{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;color:var(--label-2);font-size:14px}
.gu-x:hover{background:var(--fill)}
.gu-t{display:block;font:600 19px/1.25 var(--display);letter-spacing:-.01em;margin:10px 0 6px}
.gu-p{margin:0;font-size:14.5px;line-height:1.55;color:var(--label-2)}
.gu-f{display:flex;align-items:center;gap:8px;margin-top:14px}
.gu-sp{flex:1}
.gu-b{min-height:38px;padding:0 14px;border-radius:980px;background:var(--fill);color:var(--label);font-weight:550;font-size:14px}
.gu-b:hover{background:var(--fill-2);box-shadow:inset 0 0 0 1px var(--hair)}
.gu-b.gu-pri{background:var(--btn);color:var(--on-btn)}
.gu-b.gu-pri:hover{opacity:.92;box-shadow:none}
.gu-bar{height:3px;border-radius:3px;background:var(--fill);margin-top:14px;overflow:hidden}
.gu-bar i{display:block;height:100%;background:var(--label);border-radius:3px;transition:width .3s var(--ease)}
/* lista de guías (ayuda y portada) */
.gu-lista{display:grid;gap:8px}
.gu-item{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:12px 14px;border-radius:12px;background:var(--panel);box-shadow:var(--shadow-sm);color:var(--label)}
.gu-item:hover{box-shadow:var(--shadow-md)}
.gu-ic{width:32px;height:32px;border-radius:9px;display:grid;place-items:center;background:var(--fill);font:600 13px/1 var(--text);color:var(--label-2);flex:none;font-variant-numeric:tabular-nums}
.gu-it{flex:1;min-width:0}
.gu-it b{display:block;font-size:14.5px}
.gu-it small{display:block;color:var(--label-3);font-size:12.5px;margin-top:2px}
.gu-go{font-size:13px;font-weight:600;color:var(--accent);flex:none}
.gu-compacta{grid-template-columns:repeat(auto-fill,minmax(260px,1fr))}
.gu-port{margin-top:14px}
.gu-port .sectitle{margin-top:0}

/* ── Lector de documentos ── */
.lec-wait{display:flex;flex-direction:column;align-items:center;text-align:center;gap:14px;padding:26px 10px 10px}
.lec-wait p{margin:0;font-size:15px}
.lec-wait .caption{max-width:46ch;line-height:1.5}
.lec-spin{width:34px;height:34px;border-radius:50%;border:3px solid var(--fill-3);border-top-color:var(--accent);animation:lec-rot .9s linear infinite}
@keyframes lec-rot{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.lec-spin{animation:none;border-top-color:var(--accent)}}
.lec-docs{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:8px}
.lec-doc{display:flex;flex-direction:column;gap:6px;padding:9px 12px;border:.5px solid var(--hair);border-radius:12px;background:var(--fill-2)}
.lec-doc-t{display:flex;flex-direction:column;gap:2px;font-size:14px}
.lec-doc-t small{color:var(--label-3);font-size:12.5px}
.lec-avisos{margin:10px 0 0;padding:10px 12px 10px 30px;font-size:13px;color:var(--label-2);line-height:1.45;border-radius:12px;background:color-mix(in srgb,var(--orange) 9%,transparent)}
.lec-avisos li{margin:2px 0}
.lec-row{cursor:pointer;align-items:flex-start}
.lec-row input{margin:3px 12px 0 0;width:18px;height:18px;flex:none;accent-color:var(--accent)}
.lec-row .t small{white-space:normal;line-height:1.4}
.lec-row .lec-src{color:var(--label-3);font-size:12px;margin-top:2px}
.lec-duda{background:color-mix(in srgb,var(--orange) 7%,transparent)}
.lec-duda .lec-src{color:var(--orange)}
.lec-acts{display:flex;flex-direction:column;gap:8px;margin-top:16px}
.lec-tipos{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:4px 16px;margin:14px 0 0;padding:0 0 0 18px;font-size:13px;color:var(--label-2);line-height:1.5}
.lec-res .kv{margin-top:8px}
.lec-res .kv > span{padding:7px 0;border-top:.5px solid var(--hair)}
.lec-res .kv > span:nth-child(-n+2){border-top:0}
.lec-franja{display:flex;align-items:center;gap:14px;margin-top:14px;padding:14px 16px;flex-wrap:wrap}
.lec-franja .t{flex:1;min-width:240px;display:flex;flex-direction:column;gap:3px}
.lec-franja .t small{color:var(--label-2);line-height:1.45;white-space:normal}
.lec-franja .acts{display:flex;gap:8px;flex-wrap:wrap}
.lec-franja .btn input{display:none}


/* ══════════════════════════════════════════════════════════════════════════════
   v8 · «Despacho» (07-10-2026) — sistema de componentes único
   Sustituye las capas v5 «luminoso», v6 «Sobrio» y v7 «Quiet premium». Tokens en shell.html.
   Reglas: una línea de 1 px hace de borde; la sombra solo en lo que flota; el color solo significa estado;
   serifa solo en títulos de página; cifras siempre tabulares; etiquetas en minúscula inicial, nunca en versalitas.
   ══════════════════════════════════════════════════════════════════════════════ */

/* ── Base ── */
body{font-size:var(--fs-body);line-height:1.5;letter-spacing:-.003em}
::selection{background:var(--brand-tint)}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
.btn:focus-visible,.tbtn:focus-visible,.chip-r:focus-visible,.seg button:focus-visible{outline-offset:2px}
input:focus-visible,select:focus-visible,textarea:focus-visible{outline:none}
.group :focus-visible,.kpis :focus-visible,.tablewrap :focus-visible,.rd-list :focus-visible{outline-offset:-2px}
.num,.fig,.money,.kpi b,.v,td.n,.rd-days b,.kv > span:nth-child(even),.due,.mono{font-variant-numeric:lining-nums tabular-nums;font-feature-settings:"tnum" 1,"lnum" 1}
.mono{font-family:var(--font-sans);letter-spacing:0;color:inherit}
.hide{display:none!important}
svg{flex:none}

/* ── Tipografía ── */
.greet{font:500 var(--fs-caption)/1.3 var(--font-sans);letter-spacing:0;color:var(--ink-3);margin:0 0 6px;text-transform:none}
.greet .mono{color:var(--ink-2)}
.ltitle{font:600 var(--fs-h1)/1.12 var(--font-display);letter-spacing:-.012em;color:var(--ink-1);margin:0;text-wrap:balance}
@media (min-width:1024px){.ltitle{font-size:30px}}
.ltitle em{font-style:normal;color:var(--ink-3)}
.lsub{font-size:var(--fs-small);color:var(--ink-2);gap:4px 10px;margin:8px 0 0}
.lsub .sep{width:3px;height:3px;background:var(--ink-4)}
.h2{font:600 var(--fs-h2)/1.3 var(--font-sans);letter-spacing:-.012em;margin:36px 0 12px}
.h3{font:600 var(--fs-h3)/1.35 var(--font-sans)}
.caption{font-size:var(--fs-small);color:var(--ink-2)}
.foot-note{font-size:var(--fs-caption);color:var(--ink-3);line-height:1.55;margin:28px 2px 0;max-width:110ch}
.kick,.card .k,.card-h .k,.phead .kick,.detail-h .kicker,.sn-menu .sn-h,.gu-k,.rd-acc-gh,.sgrp,.side .sect,.rd-dinero-k{font:500 var(--fs-label)/1.3 var(--font-sans)!important;letter-spacing:0!important;text-transform:none!important;color:var(--ink-3)}
.card-h .k::before{display:none}
.card-h h3{font:600 15px/1.35 var(--font-sans);letter-spacing:-.008em;margin:2px 0 0}
.sectitle{font:600 var(--fs-small)/1.3 var(--font-sans);color:var(--ink-2);margin:28px 2px 8px}
.sectitle.flex{margin:32px 2px 10px;font-size:var(--fs-small);color:var(--ink-3);align-items:baseline}
.sectitle.flex b{font:600 var(--fs-h2)/1.3 var(--font-sans)!important;letter-spacing:-.012em;color:var(--ink-1)}
.sectitle.flex span{font-size:var(--fs-small);color:var(--ink-3)}
.group-foot{font-size:var(--fs-caption);color:var(--ink-3);margin:8px 14px 0}
.lead{font-size:15px;line-height:1.6;color:var(--ink-1)}
.link{color:var(--brand);font-size:var(--fs-small);font-weight:500}
.link:hover{color:var(--brand-hover);text-decoration:underline;text-underline-offset:3px}
a:hover{text-decoration-thickness:1px}

/* Cifras económicas: tabulares, peso propio, el símbolo un punto más ligero */
.money{font-weight:600;letter-spacing:-.01em;white-space:nowrap;color:inherit}
.money .cur,.amt .cur,.kpi b .cur{font-weight:500;color:var(--ink-3);font-size:.78em;margin-left:.18em;letter-spacing:0}
.money.neg{color:var(--danger)}

/* ── Botones: primario (tinta), secundario (línea), fantasma, destructivo (línea roja, siempre aparte) ── */
.btn{min-height:44px;padding:0 18px;border-radius:var(--r-ctl);background:var(--ink-1);color:var(--on-ink);font:550 14px/1 var(--font-sans);letter-spacing:-.005em;gap:7px;box-shadow:none;transition:background var(--dur-1),box-shadow var(--dur-1),color var(--dur-1),transform 80ms}
.btn:hover{opacity:1;background:color-mix(in srgb,var(--ink-1) 86%,var(--bg))}
.btn:active{transform:scale(.985)}
.btn svg{width:16px;height:16px;stroke-width:1.8}
.btn.sm{min-height:36px;padding:0 13px;font-size:13px}
@media (min-width:1024px){.btn{min-height:34px;padding:0 14px;font-size:13.5px}.btn.sm{min-height:30px;padding:0 11px;font-size:13px}.btn svg{width:15px;height:15px}}
.btn.gray,.btn.ghost{background:var(--surface);color:var(--ink-1);box-shadow:inset 0 0 0 1px var(--border-2)}
.btn.gray:hover,.btn.ghost:hover{background:var(--surface-2);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--ink-1) 28%,var(--border-2))}
.btn.ghost{background:transparent;box-shadow:none;color:var(--ink-2)}
.btn.ghost:hover{background:var(--hover);box-shadow:none;color:var(--ink-1)}
.btn.tint{background:var(--brand-tint);color:var(--brand)}
.btn.tint:hover{background:color-mix(in srgb,var(--brand) 14%,transparent)}
.btn.gold{background:var(--success-bg);color:var(--success)}
.btn.danger{background:transparent;color:var(--danger);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--danger) 35%,transparent)}
.btn.danger:hover{background:var(--danger-bg)}
.btn.danger.block{width:auto}
.btn[disabled],.btn[aria-disabled="true"]{opacity:.45;pointer-events:none}
.btn.block{width:100%}
.zona-peligro{margin-top:28px;padding-top:16px;border-top:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.zona-peligro p{margin:0;font-size:var(--fs-caption);color:var(--ink-3);max-width:46ch}
.tbtn{min-height:36px;padding:0 8px;border-radius:var(--r-ctl);color:var(--ink-2);font-size:14px;gap:6px;transition:background var(--dur-1),color var(--dur-1)}
.tbtn:hover{background:var(--hover);color:var(--ink-1)}
.tbtn svg{width:18px;height:18px;stroke-width:1.75}
@media (max-width:1023px){.tbtn{min-height:44px}.tbtn svg{width:20px;height:20px}}

/* ── Controles: segmentado, interruptor, búsqueda ── */
.seg{padding:2px;gap:2px;border-radius:var(--r-ctl);background:var(--sunken);box-shadow:inset 0 0 0 1px var(--border-soft)}
.seg button{padding:5px 12px;border-radius:6px;font:500 13px/1.35 var(--font-sans);color:var(--ink-2)}
.seg button:hover{color:var(--ink-1)}
.seg button[aria-pressed="true"],:root[data-theme="light"] .seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink-1);box-shadow:0 0 0 1px var(--border),0 1px 2px rgba(var(--shadow-rgb),.06)}
.field .seg{border-radius:var(--r-ctl)}
.field .seg button{border-radius:6px}
.switch span{background:var(--border-2)}
.switch input:checked + span{background:var(--brand)}
.switch input:focus-visible + span{outline:2px solid var(--brand);outline-offset:2px}
@media (min-width:1024px){.switch{width:36px;height:21px}.switch span::after{width:17px;height:17px}.switch input:checked + span::after{transform:translateX(15px)}}
.search,:root[data-theme="light"] .search{height:34px;border-radius:var(--r-ctl);background:var(--surface);box-shadow:inset 0 0 0 1px var(--border-2);color:var(--ink-3);padding:0 10px}
.search:focus-within{box-shadow:inset 0 0 0 1px var(--brand),0 0 0 3px var(--brand-tint)}
.search input{font-size:14px}
@media (min-width:1024px){.search input,.headacts .search input{font-size:13.5px}.headacts .search{height:32px}}
.kbd{font:500 10.5px/1.5 var(--font-sans);color:var(--ink-3);border:1px solid var(--border);border-radius:4px;padding:0 5px;background:var(--surface-2)}

/* ── Superficies: panel, grupo, banda de cifras ── */
.card,.group,.infobar,.ask,.tile,.ej,.doccard,.heir,.lever,.norma,.personal,.altpath,.bcard,.rd-list,.rd-ok,.rd-dinero,.rd-strip,.gu-item,.fcard,.res-mas button{border-radius:var(--r-panel);box-shadow:var(--sh-1)}
.card{padding:20px 22px;background:var(--surface)}
@media (min-width:1100px){.card{padding:18px 20px}}
.card.flat{background:transparent;box-shadow:inset 0 0 0 1px var(--border)}
button.card:hover,.doccard:hover,.ej:hover,.bcard:hover,.gu-item:hover,.fcard:hover{box-shadow:0 0 0 1px var(--border-2),0 2px 6px -2px rgba(var(--shadow-rgb),.08);background:var(--surface)}
.card-h{margin-bottom:14px}
.card .group{box-shadow:none}
.group{background:var(--surface)}
.row{min-height:48px;padding:10px 16px}
@media (min-width:1100px){.row{min-height:46px;padding:9px 14px}}
.row + .row::before,.row + .field::before,.field + .row::before{background:var(--border-soft);height:1px}
.row .t b{font-weight:500;font-size:14px;letter-spacing:-.005em}
@media (max-width:1023px){.row .t b{font-size:15px}}
.row .t small{font-size:var(--fs-caption);color:var(--ink-3);margin-top:2px}
.row .v{color:var(--ink-1)}
button.row:hover,label.row:hover,.linkrow:hover{background:var(--hover)}
.chev{color:var(--ink-4)}
.infobar{background:var(--surface);padding:12px 14px;font-size:var(--fs-small);line-height:1.5;color:var(--ink-2)}
.infobar b{color:var(--ink-1)}
.infobar .ico{background:var(--sunken);color:var(--ink-2)}
/* Iconos en baldosa: neutros; el color solo cuando significa estado */
.ico{width:30px;height:30px;border-radius:var(--r-ctl);background:var(--sunken);color:var(--ink-2);box-shadow:none}
.ico svg{width:16px;height:16px;stroke-width:1.75}
.ico.red{background:var(--danger-bg);color:var(--danger)}
.ico.orange{background:var(--warning-bg);color:var(--warning)}
.ico.green,.ico.gold{background:var(--success-bg);color:var(--success)}
.ico.blue,.ico.teal,.ico.indigo,.ico.q,.ico.gray,.ico.brown{background:var(--sunken);color:var(--ink-2)}
/* Banda de cifras: una superficie con divisiones (no tarjetas sueltas) */
.kpis{gap:0;background:var(--surface);border-radius:var(--r-panel);box-shadow:var(--sh-1);overflow:hidden}
@media (min-width:760px){.kpis:not(.kpis3):not([style*="grid-template-columns"]){grid-template-columns:repeat(auto-fit,minmax(128px,1fr))}}
.kpi{position:relative;background:transparent;border-radius:0;box-shadow:-1px 0 0 var(--border-soft),0 -1px 0 var(--border-soft);padding:14px 18px 15px;min-width:0}
.kpi::before,.kpi::after{content:none!important}
button.kpi{cursor:pointer}
button.kpi:hover{background:var(--hover)}
.kpi .k{font:500 var(--fs-caption)/1.3 var(--font-sans);color:var(--ink-3);padding-right:0!important;text-transform:none;letter-spacing:0}
.kpi b{font:600 22px/1.15 var(--font-sans);letter-spacing:-.02em;margin-top:6px;color:var(--ink-1)}
.kpi small{font-size:var(--fs-caption);color:var(--ink-3);margin-top:4px}
.kpi.bad b{color:var(--danger)}.kpi.warn b{color:var(--warning)}.kpi.ok b,.kpi.gold b{color:var(--success)}
.kpi.bad,.kpi.warn,.kpi.gold,.kpi.ok{background:transparent}
.kpi.bad::after{content:""!important;position:absolute;left:0;right:0;top:0;height:2px;background:var(--danger);width:auto;border-radius:0;-webkit-mask:none;mask:none}
@media (max-width:759px){.kpi{padding:12px 14px 13px}.kpi b{font-size:20px}}
.tiles{gap:0;background:var(--surface);border-radius:var(--r-panel);box-shadow:var(--sh-1);overflow:hidden}
.tile{border-radius:0;box-shadow:-1px 0 0 var(--border-soft),0 -1px 0 var(--border-soft);background:transparent}

/* ── Estados: un único lenguaje (chip) para Pendiente · En revisión · Validado · Vencido ── */
.chip,.st-b,.tag,.fase,.mtag{display:inline-flex;align-items:center;gap:6px;height:22px;padding:0 8px;border-radius:var(--r-chip);font:500 12px/1 var(--font-sans);letter-spacing:0;white-space:nowrap;color:var(--ink-2);background:var(--sunken);box-shadow:none;vertical-align:middle}
.st-b i,.chip i{width:6px;height:6px;border-radius:50%;background:var(--ink-4);flex:none}
.chip.ok,.st-b.ok,.tag.V,.tag.bajo{color:var(--success);background:var(--success-bg)}
.chip.warn,.st-b.warn,.tag.P,.tag.medio,.tag.warn{color:var(--warning);background:var(--warning-bg)}
.chip.bad,.st-b.bad,.tag.alto,.tag.litigioso{color:var(--danger);background:var(--danger-bg)}
.chip.info,.tag.gold{color:var(--info);background:var(--info-bg)}
.st-b.ok i,.chip.ok i{background:var(--success)}.st-b.warn i,.chip.warn i{background:var(--warning)}.st-b.bad i,.chip.bad i{background:var(--danger)}
.st-line{display:inline-flex;gap:6px;flex-wrap:wrap;align-items:center}
.fase{height:22px;color:var(--ink-2);background:var(--sunken)}
.fase.f0,.fase.f1{color:var(--ink-2)}
.dot{width:7px;height:7px}
.dot.ok{background:var(--success)}.dot.warn{background:var(--warning)}.dot.bad{background:var(--danger)}.dot.acc,.dot.gold{background:var(--ink-4)}
.due{font-size:var(--fs-caption);color:var(--ink-2)}
.due.warn{color:var(--warning);font-weight:500}.due.bad{color:var(--danger);font-weight:500}
.status.ok{color:var(--success)}.status.warn{color:var(--warning)}.status.bad{color:var(--danger)}
.av{width:24px;height:24px;background:var(--sunken);color:var(--ink-2);font:600 10px/1 var(--font-sans);letter-spacing:.02em;box-shadow:inset 0 0 0 1px var(--border-soft)}
.av.big{width:30px;height:30px;font-size:11px}
.chip-r{height:30px;padding:0 10px 0 3px;border-radius:var(--r-pill);background:var(--surface);box-shadow:inset 0 0 0 1px var(--border);font:500 13px/1 var(--font-sans);color:var(--ink-1);gap:7px}
.chip-r:hover{background:var(--surface-2);box-shadow:inset 0 0 0 1px var(--border-2)}
.chip-r .av{width:24px;height:24px}
.chip-r.warn{padding:0 10px;color:var(--warning);background:var(--warning-bg);box-shadow:none}
.chip-r.rd-clear{padding:0 12px}

/* ── Barra lateral ── */
@media (min-width:1024px){
  .side,:root[data-theme="light"] .side{background:var(--sunken);-webkit-backdrop-filter:none;backdrop-filter:none;border-right:1px solid var(--border);padding:14px 10px 10px}
}
.side .brandrow{padding:2px 6px 14px;gap:10px}
.logo,:root[data-theme="light"] .logo,.side .logo{width:28px;height:28px;border-radius:0;background:none;box-shadow:none;display:inline-grid;place-items:center;flex:none}
.logo svg,.logo svg:only-child{width:100%;height:100%;display:block}
.logo .logo-bg{fill:var(--logo-bg)}
.logo .logo-m{fill:var(--logo-ink)}
.logo .logo-p{fill:var(--logo-acc,var(--logo-ink))}
.brandname{font:600 15px/1.1 var(--font-sans);letter-spacing:-.012em}
.side .brandrow .caption{font-size:var(--fs-caption);color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:180px}
.side .search{margin:0 2px 8px}
.side .newbtn{margin:0 2px 12px}
.side .newbtn .btn{min-height:32px;justify-content:center}
