$("o-l2").innerHTML=wordsHTML("La herencia,");$("o-l3").innerHTML=wordsHTML("lista en")+' <span class="w"><span class="grad" style="font-style:italic">una</span></span> <span class="w"><span class="grad" style="font-style:italic">tarde.</span></span>';
$("w-h").innerHTML=wordsHTML("Del primer papel a la firma.");

// partículas de luz que forman el monograma: destinos sobre el contorno y las letras
const PTS=(()=>{const out=[];const svg=$("o-svg");const paths=[...svg.querySelectorAll("#o-lines path")];
  const box={x:830,y:200,s:260/120,o:-10};
  paths.forEach((p,pi)=>{const L=p.getTotalLength(),n=pi?36:64;for(let i=0;i<n;i++){const q=p.getPointAtLength(L*i/n);
    const tx=box.x+(q.x-box.o)*box.s,ty=box.y+(q.y-box.o)*box.s;const a=rnd()*Math.PI*2,r=500+rnd()*800;
    const d=document.createElement("div");d.className="pt";$("o-pts").appendChild(d);
    out.push({d,tx,ty,sx:960+Math.cos(a)*r,sy:330+Math.sin(a)*r*.6,ta:1.0+rnd()*1.7,sw:(rnd()-.5)*1.4,sz:.6+rnd()*1.1});}});
  return out;})();

// ───────── render por tiempo
function setWords(ws,t,a,stag=.06,dur=.9){ws.forEach((w,i)=>{const k=eo(seg(t,a+i*stag,a+i*stag+dur));w.style.transform=`translateY(${(1-k)*105}%)`;w.style.filter=`blur(${(1-k)*6}px)`;w.style.opacity=.2+.8*k;});}
function cardOpen(s,t){
  const g=$("o-lines"),fill=$("o-fill");
  // partículas que convergen
  PTS.forEach((p)=>{const u=seg(t,.15,p.ta),k=eo(u);const ang=(1-k)*p.sw;
    const dx=p.sx-p.tx,dy=p.sy-p.ty;const x=p.tx+(dx*Math.cos(ang)-dy*Math.sin(ang))*(1-k),y=p.ty+(dx*Math.sin(ang)+dy*Math.cos(ang))*(1-k);
    const o=seg(t,.1,.7)*(1-seg(t,p.ta+.05,p.ta+.6));p.d.style.opacity=o;p.d.style.transform=`translate(${x}px,${y}px) scale(${p.sz*(1+(1-k)*.8)})`;p.d.style.display=o>0?"block":"none";});
  // trazos de luz
  const dl=io(seg(t,1.0,3.0));g.querySelectorAll("path").forEach((p,i)=>{p.style.strokeDasharray="1 1";p.style.strokeDashoffset=1-io(seg(t,1.0+i*.25,2.7+i*.25));});
  g.style.opacity=seg(t,.9,1.2)*(1-.85*seg(t,3.1,3.9));
  const f=eo(seg(t,2.9,3.8));fill.setAttribute("opacity",f);
  $("o-shine").setAttribute("x",lerp(-60,130,io(seg(t,3.5,4.6))));
  const svg=$("o-svg");const lift=io(seg(t,8.6,10.2));
  svg.style.transform=`translateY(${-lift*90}px) scale(${lerp(1,.86,lift)*lerp(.92,1,eo(seg(t,.5,3.6)))})`;svg.style.opacity=1-seg(t,8.9,10);
  $("o-halo").style.opacity=(.35+.65*f)*(1-seg(t,8.6,10.2));$("o-halo").style.transform=`scale(${lerp(.7,1.1,seg(t,0,10))})`;
  const l1=eo(seg(t,4.0,5.2));$("o-l1").style.opacity=l1*(1-seg(t,8.6,9.6));$("o-l1").style.letterSpacing=lerp(.55,.32,l1)+"em";
  setWords([...$("o-l2").querySelectorAll(".w>span")],t,4.6,.12,1.1);setWords([...$("o-l3").querySelectorAll(".w>span")],t,5.1,.12,1.1);
  ["o-l2","o-l3"].forEach((id,i)=>{const e=$(id);e.style.opacity=1-seg(t,8.6+i*.1,9.7);e.style.transform=`translateY(${-io(seg(t,8.6,10.2))*60}px)`;e.style.filter=`blur(${seg(t,8.7,10)*10}px)`;});
}
function cardWall(s,t,T){
  const rig=$("w-rig");const k=seg(t,0,s.dur);
  const rot=lerp(9,-9,io(k)),dz=lerp(-700,-250,eo(k));
  rig.style.transform=`translateZ(${dz}px) rotateY(${rot}deg)`;
  s.tiles.forEach((tl)=>{const th=tl.i*15*Math.PI/180,R=2300;const x=Math.sin(th)*R,z=(Math.cos(th)-1)*R;
    const rise=eo(seg(t,.2+Math.abs(tl.i)*.12,1.6+Math.abs(tl.i)*.12));
    tl.d.style.transform=`translate3d(${960-800+x}px,${620-500+(1-rise)*160}px,${z}px) rotateY(${-tl.i*15}deg) scale(.4)`;tl.d.style.opacity=rise;});
  $("w-eb").style.opacity=eo(seg(t,.8,1.8));
  setWords([...$("w-h").querySelectorAll(".w>span")],t,1.0,.09,1.0);
}
function cardClose(s,t){
  const A=fade(t,.3,5.8,.9),B=fade(t,5.8,11.4,.9),C=eo(seg(t,11.2,12.8));
  [["c-a",A,.3],["c-b",B,5.8]].forEach(([id,o,a])=>{const e=$(id);e.style.opacity=o;e.style.display=o>0?"block":"none";e.style.filter=`blur(${(1-clamp(o))*10}px)`;e.style.transform=`scale(${lerp(1.04,1,eo(seg(t,a,a+2)))})`;});
  setWords([...$("c-ah").querySelectorAll(".w>span")],t,.5,.1,1.1);$("c-ap").style.opacity=eo(seg(t,1.5,2.6));
  document.querySelectorAll("#c-b [data-n]").forEach((b,i)=>{const k=eo(seg(t,6.2+i*.22,8.4+i*.22));b.textContent=fmt(+b.dataset.n*k);});
  document.querySelectorAll("#c-b .stat").forEach((e,i)=>{const k=eo(seg(t,6.0+i*.12,7.2+i*.12));e.style.opacity=k;e.style.transform=`translateY(${(1-k)*30}px)`;});
  const cc=$("c-c");cc.style.display=C>0?"block":"none";cc.style.opacity=C;
  const m=eo(seg(t,11.2,13.0));$("c-svg").style.transform=`translateY(${(1-m)*30}px) scale(${lerp(.82,1,m)})`;$("c-svg").style.opacity=m;
  $("c-shine").setAttribute("x",lerp(-60,130,io(seg(t,12.8,14.0))));
  $("c-halo").style.opacity=m*(.85+.15*Math.sin(t*1.4));
  const n=eo(seg(t,11.8,13.2));$("c-name").style.opacity=n;$("c-name").style.transform=`translateY(${(1-n)*30}px)`;$("c-name").style.letterSpacing=lerp(.04,-.03,n)+"em";$("c-name").style.filter=`blur(${(1-n)*10}px)`;
  const g=eo(seg(t,12.5,13.8));$("c-tag").style.opacity=g;$("c-tag").style.transform=`translateY(${(1-g)*24}px)`;
  const c2=eo(seg(t,13.4,14.6));$("c-cta").style.opacity=c2;$("c-cta").style.transform=`translateY(${(1-c2)*20}px)`;
  cc.style.transform=`scale(${lerp(1,1.025,seg(t,11.2,s.dur))})`;
}

function drawPlane(s,st,T){
  const {cx,cy,z,ox,oy,rx,ry,sy,alpha,blur,reveal,t}=st;
  s.el.style.display="";s.el.style.opacity=alpha;
  s.pl.style.transform=`translate(${960+ox}px,${540+oy}px) rotateX(${rx}deg) rotateY(${ry}deg) scale(${z}) translate(${-cx}px,${-cy}px)`;
  s.pl.style.filter=blur>.05?`blur(${blur/Math.max(z,.3)}px)`:"none";
  s.ct.style.transform=`translateY(${-sy}px)`;s.sp.style.transform=`translateY(${-sy}px)`;
  if(s.fix)s.fix.forEach((f)=>{f.im.style.display=f.on(sy)?"block":"none";});
  // reflejo que cruza el cristal, más visible cuando el plano está inclinado
  const tilt=clamp((Math.abs(rx)+Math.abs(ry))/30);
  s.gl.style.background=`linear-gradient(${105+ry*1.2}deg,transparent ${18+t*2.2}%,rgba(255,255,255,${.035+.06*tilt}) ${28+t*2.2}%,transparent ${42+t*2.2}%)`;
  // materialización: barrido de luz de arriba abajo
  if(reveal<1){const p=reveal*112-6;s.pl.style.webkitMaskImage=`linear-gradient(180deg,#000 ${p-4}%,rgba(0,0,0,.35) ${p}%,transparent ${p+3}%)`;s.scan.style.display="block";s.scan.style.top=(p/100*s.vh)+"px";s.scan.style.opacity=1-seg(reveal,.85,1);}
  else{s.pl.style.webkitMaskImage="";s.scan.style.display="none";}
  // secuencias
  let curImg=s.base,ms=0;
  if(s.seqImgs.length){let q=null;s.seqImgs.forEach((x)=>{if(t>=x.a)q=x;});
    if(q){ms=(t-q.a)*1000;let fr=q.frames[0];for(const f of q.frames){if(f.ms<=ms)fr=f;else break;}curImg=fr.im;}}
  [s.base,...s.seqImgs.flatMap((q)=>q.frames.map((f)=>f.im))].forEach((im)=>{im.style.display=im===curImg?"block":"none";});
  s.cur_img=curImg;
  // focos
  s.hls.forEach((h,i)=>{const d=s.spotEls[i],o=fade(t,h.a,h.b,.55);d.style.opacity=o;d.style.display=o>0?"block":"none";
    if(o>0){const [x,y,w,hh]=h.r;const pad=lerp(22,8,eo(seg(t,h.a,h.a+.9)));Object.assign(d.style,{left:x-pad+"px",top:y-pad+"px",width:w+2*pad+"px",height:hh+2*pad+"px"});
      d.firstChild.style.backgroundPosition=`${lerp(130,-30,io(seg(t,h.a+.3,h.a+1.6)))}% 0`;}});
  // cursor
  const c=cursorAt(s,t);
  if(c&&c.o>0){s.cur.style.display="block";s.cur.style.opacity=c.o;const sc=c.clk!==undefined&&c.clk<.18?.86:1;s.cur.style.transform=`translate(${c.x-3}px,${c.y-3}px) scale(${sc/Math.max(.9,Math.min(1.3,z))})`;}
  else s.cur.style.display="none";
  if(c&&c.clk!==undefined&&c.clk>=0){const k=c.clk/.6;const r=lerp(6,46,eo(k));s.rip.style.display="block";Object.assign(s.rip.style,{width:2*r+"px",height:2*r+"px",transform:`translate(${c.x-r}px,${c.y-r}px)`,opacity:(1-k)*.9});}
  else s.rip.style.display="none";
}

const TRANS=SHOTS.filter((s,i)=>i>0).map((s)=>({m:s.t0+s.xf/2,tin:s.tin||"card",xf:s.xf}));
let lastVisible=new Set();
window.speedAt=function(T){
  let sp=0;const dt=1/FPS;
  SHOTS.forEach((s)=>{if(s.card)return;const a=pstate(s,T),b=pstate(s,T+dt);if(!a||!b||a.alpha<.05)return;
    const P=[[0,0],[s.w,0],[0,s.vh],[s.w,s.vh],[s.w/2,s.vh/2]];
    for(const [px,py] of P){const xa=960+a.ox+a.z*(px-a.cx),ya=540+a.oy+a.z*(py-a.cy),xb=960+b.ox+b.z*(px-b.cx),yb=540+b.oy+b.z*(py-b.cy);
      const rot=Math.abs(a.ry-b.ry)*12+Math.abs(a.rx-b.rx)*12;sp=Math.max(sp,Math.hypot(xb-xa,yb-ya)+rot);}
    sp=Math.max(sp,Math.abs(b.sy-a.sy)*a.z);});
  return sp;
};
window.renderAt=async function(T,f){
  bgAt(T);grainAt(f||0);
  const waits=[];let dofPx=.0,anyApp=false;
  // planos
  SHOTS.forEach((s)=>{
    if(s.card){const t=T-s.t0;let a=0;
      if(t>=0&&t<=s.dur){a=1;if(s.i>0&&t<s.xf)a=io(t/s.xf);if(s.next&&t>s.dur-s.next.xf)a=Math.min(a,1-io(seg(t,s.dur-s.next.xf,s.dur)));}
      s.el.style.display=a>0?"block":"none";s.el.style.opacity=a;
      if(a>0){if(s.card==="open")cardOpen(s,t);else if(s.card==="wall"){s.tiles.forEach((tl)=>waits.push(need(tl.im)));cardWall(s,t,T);s.el.style.filter=`blur(${(1-a)*8}px)`;}else cardClose(s,t);}
      else if(s.card==="wall")s.tiles.forEach((tl)=>{if(T>s.t0+s.dur+2)drop(tl.im);});
      return;}
    const st=pstate(s,T);
    if(!st||st.alpha<=0){s.el.style.display="none";
      if(T>s.t0+s.dur+1.5||T<s.t0-6){drop(s.base);s.seqImgs.forEach((q)=>q.frames.forEach((fr)=>drop(fr.im)));if(s.fix)s.fix.forEach((x)=>drop(x.im));}
      else if(T>s.t0-3){waits.push(need(s.base));if(s.fix)s.fix.forEach((x)=>waits.push(need(x.im)));}
      return;}
    anyApp=true;
    waits.push(need(s.base));if(s.fix)s.fix.forEach((x)=>waits.push(need(x.im)));
    drawPlane(s,st,T);waits.push(need(s.cur_img));
    // precarga de los fotogramas de secuencia cercanos
    s.seqImgs.forEach((q)=>{const lt=st.t-q.a;q.frames.forEach((fr)=>{const d=fr.ms/1000-lt;if(fr.im===s.cur_img)return;if(d>-.5&&d<1.2)waits.push(need(fr.im));else if(d<-1.5||d>4)drop(fr.im);});});
    if(st.alpha>.5)dofPx=Math.max(dofPx,.8+3.2*clamp((Math.abs(st.rx)+Math.abs(st.ry))/28));
  });
  // profundidad de campo y aberración cromática

  const near=TRANS.reduce((m,x)=>Math.min(m,Math.abs(T-x.m)/Math.max(.6,x.xf)),9);
  const caAmt=1.6+3.4*clamp(1-near);
  window.POST={dof:+dofPx.toFixed(2),ca:+(anyApp?caAmt:1.2).toFixed(2)};
  // fugas de luz y barrido
  const leakK=TRANS.reduce((m,x)=>Math.max(m,(x.tin==="cont"?0:x.tin==="push"?.9:x.tin==="slide"?.75:.5)*Math.exp(-Math.pow((T-x.m)/.75,2))),0);
  const open=SHOTS[0],close=SHOTS[SHOTS.length-1];
  const leakO=Math.max(leakK,.55*Math.exp(-Math.pow((T-3.4)/.9,2)),.5*Math.exp(-Math.pow((T-close.t0-12.6)/1.0,2)));
  renderLeaks(T,leakO);
  const sw=TRANS.filter((x)=>x.tin==="slide"||x.tin==="push").map((x)=>seg(T,x.m-.75,x.m+.75)).find((u)=>u>0&&u<1);
  $("sweep").style.opacity=sw!==undefined?Math.sin(sw*Math.PI)*.9:0;$("sweep").style.transform=`translateX(${sw!==undefined?lerp(-60,60,sw):0}%)`;
  // destello anamórfico (apertura y cierre)
  const fl=Math.max(Math.exp(-Math.pow((T-3.35)/.32,2)),Math.exp(-Math.pow((T-close.t0-12.9)/.4,2))*.8);
  const flY=T<20?(200+130):(250+75);$("flare").style.top=flY+"px";$("flare").style.opacity=fl;$("flare").style.transform=`scaleX(${.6+.6*fl})`;
  // rótulos
  let sideO={b:0,l:0,r:0};
  CAPS.forEach((c)=>{const o=fade(T,c.A,c.B,.8);c.el.style.display=o>0?(c.s==="b"?"flex":"block"):"none";if(o<=0)return;
    const out=seg(T,c.B-.8,c.B);c.el.style.opacity=o;c.el.style.filter=`blur(${out*6}px)`;
    const base=c.s==="b"?"":"translateY(-50%) ";c.el.style.transform=base+`translateY(${-out*12}px)`;
    const ke=eo(seg(T,c.A,c.A+.9));c.ebe.style.opacity=ke;c.ebi.style.width=lerp(0,46,ke)+"px";
    setWords(c.ws,T,c.A+.15,.07,.95);
    if(c.pe){const kp=eo(seg(T,c.A+.6,c.A+1.7));c.pe.style.opacity=kp;c.pe.style.transform=`translateY(${(1-kp)*16}px)`;}
    sideO[c.s]=Math.max(sideO[c.s],o);});
  $("scrimB").style.opacity=sideO.b;$("scrimL").style.opacity=sideO.l;$("scrimR").style.opacity=sideO.r;
  // teclas
  const ke=$("keys");const K=KEYS.find((k)=>T>=k.A&&T<=k.B);
  if(K){if(ke.dataset.k!==K.k.join())ke.innerHTML=K.k.map((x)=>`<div class="key">${x}</div>`).join("<div class='key' style='background:none;box-shadow:none;min-width:0;padding:0;color:var(--ink3)'>+</div>"),ke.dataset.k=K.k.join();
    const o=fade(T,K.A,K.B,.4);ke.style.opacity=o;ke.style.display="flex";const pr=Math.exp(-Math.pow((T-K.P)/.09,2));
    ke.querySelectorAll(".key").forEach((k,i)=>{if(i===1)return;k.style.transform=`translateY(${pr*6}px)`;k.style.boxShadow=`inset 0 1px 0 rgba(220,234,255,.18),0 0 0 1px rgba(108,194,184,${.22+.6*pr}),0 ${8-6*pr}px 0 #0A111C,0 18px 40px rgba(0,0,0,.6),0 0 ${40*pr}px rgba(108,194,184,.5)`;});}
  else ke.style.display="none";
  // HUD
  const firstApp=SHOTS[1],wall=SHOTS[SHOTS.length-2];
  const hv=clamp(Math.min(seg(T,firstApp.t0+1.2,firstApp.t0+2.6),1-seg(T,wall.t0,wall.t0+1)));
  $("hud").style.opacity=hv;$("hudbg").style.opacity=hv;
  const chaps=[...new Set(SHOTS.filter((s)=>s.chap).map((s)=>s.chap))];
  const lw=[...SHOTS].reverse().find((s)=>s.chap&&T>=s.t0+(s.xf||0)*.5);
  if(lw){const n=chaps.indexOf(lw.chap)+1;$("chap").innerHTML=`<b>${String(n).padStart(2,"0")}</b> / ${String(chaps.length).padStart(2,"0")} · ${lw.chap}`;}
  $("hudbar").style.width=(clamp((T-firstApp.t0)/(wall.t0-firstApp.t0))*100)+"%";
  // fundido final a negro
  $("fadeblack").style.opacity=Math.max(1-seg(T,0,.6),seg(T,TOTAL-1.4,TOTAL-.1));
  await Promise.all(waits);
};
function renderLeaks(T,k){
  const L=$("leaks");if(!L.children.length){[["rgba(224,196,138,.55)",900,700],["rgba(108,194,184,.45)",800,640],["rgba(157,188,230,.4)",700,560]].forEach(([c,w,h])=>{const d=document.createElement("div");d.className="leak";Object.assign(d.style,{width:w+"px",height:h+"px",background:`radial-gradient(closest-side,${c},transparent)`});L.appendChild(d);});}
  L.style.opacity=k;L.style.display=k>.01?"block":"none";
  [...L.children].forEach((d,i)=>{const x=[-200,1500,700][i]+Math.sin(T*.9+i*2)*260,y=[-150,600,-260][i]+Math.cos(T*.7+i)*180;d.style.transform=`translate(${x}px,${y}px)`;});
}
// control de calidad: rótulos que tapan un foco, focos fuera de cuadro
window.qa=function(T){
  const out=[];const caps=[...document.querySelectorAll(".cap")].filter((e)=>e.style.display!=="none"&&+e.style.opacity>.3).map((e)=>{const r=[...e.children].map((c)=>c.getBoundingClientRect());return r;}).flat();
  document.querySelectorAll(".spot").forEach((sp)=>{if(sp.style.display==="none"||+sp.style.opacity<.5)return;if(sp.closest(".shot").style.display==="none")return;const r=sp.getBoundingClientRect();
    if(r.left<20||r.right>1900||r.top<110||r.bottom>1070)out.push(`spot fuera ${r.left|0},${r.top|0},${r.right|0},${r.bottom|0}`);
    caps.forEach((c)=>{const ix=Math.min(r.right,c.right)-Math.max(r.left,c.left),iy=Math.min(r.bottom,c.bottom)-Math.max(r.top,c.top);if(ix>4&&iy>4)out.push(`rótulo sobre foco ${ix|0}x${iy|0}`);});});
  return out;
};
window.ready=document.fonts.ready.then(()=>Promise.all([...document.querySelectorAll("img:not([data-src])")].map((i)=>i.decode().catch(()=>{}))));
</script>
