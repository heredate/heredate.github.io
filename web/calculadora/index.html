  return `<h1 tabindex="-1">${GENERICA ? "Que un abogado revise tu caso" : `Que ${esc(NOMBRE)} revise tu caso`}</h1><p class="lead">Déjanos un nombre y cómo contactarte. Se prepara un mensaje con el resumen del cálculo y tú decides si lo envías.</p>
    <div class="card"><div class="field"><label class="l" for="f-k-nombre">Tu nombre</label><input id="f-k-nombre" data-k="k.nombre" autocomplete="name" value="${esc(k.nombre)}"></div>
    <div class="field row2"><div><label class="l" for="f-k-tel">Teléfono</label><input id="f-k-tel" type="tel" data-k="k.tel" autocomplete="tel" inputmode="tel" value="${esc(k.tel)}"></div><div><label class="l" for="f-k-email">Correo</label><input id="f-k-email" type="email" data-k="k.email" autocomplete="email" value="${esc(k.email)}"></div></div>
    <div class="field"><span class="l" id="q-hora">Mejor hora para llamarte</span><div class="chips" role="group" aria-labelledby="q-hora">${HORAS.map(([v, t]) => `<button type="button" class="chip" data-o="hora" data-v="${v}" aria-pressed="${k.hora === v}">${t}</button>`).join("")}</div></div>
    <div class="field"><label class="l" for="f-k-obs">¿Algo más? <span style="font-weight:400;color:var(--ink-3)">(opcional)</span></label><textarea id="f-k-obs" data-k="k.obs" placeholder="Ej.: queremos vender la casa, uno de los hermanos vive fuera…">${esc(k.obs)}</textarea></div></div>
    <div class="card"><label class="consent"><input type="checkbox" data-k="ok" ${S.ok ? "checked" : ""}><span class="box" aria-hidden="true"></span><span>He leído la ${priv} y acepto que ${esc(GENERICA ? "Hereda+" : NOMBRE)} use estos datos para contestar a mi consulta.<small>Responsable: ${esc(GENERICA ? "Hereda+" : NOMBRE)}. Finalidad: responder a esta consulta. No se envía nada hasta que pulses enviar en WhatsApp o en tu correo.</small></span></label></div>
    <p class="err" id="err" aria-live="polite">${touched[7] && err ? esc(err) : ""}</p>
    <div class="send${wa && ml ? "" : " one"}" id="send">${wa ? `<a class="btn wa" data-send="wa" href="${esc(err ? "#" : wa)}" target="_blank" rel="noopener" ${err ? 'aria-disabled="true"' : ""}>${I.wa}Enviar por WhatsApp</a>` : ""}${ml ? `<a class="btn${wa ? " sec" : ""}" data-send="mail" href="${esc(err ? "#" : ml)}" ${err ? 'aria-disabled="true"' : ""}>${I.mail}Enviar por correo</a>` : ""}</div>
    <p class="hint">Se abrirá ${wa && ml ? "WhatsApp o tu correo" : wa ? "WhatsApp" : "tu correo"} con el mensaje ya escrito. Solo tienes que pulsar enviar.</p>`;
}
function vHecho() {
  return `<div class="done"><div class="ok" aria-hidden="true">${I.tick}</div><h1 tabindex="-1">Mensaje preparado</h1><p class="lead">Gracias, ${esc(S.contacto.nombre.split(" ")[0] || "")}. Envíalo desde ${S.canal === "wa" ? "WhatsApp" : "tu correo"} y ${GENERICA ? "te contestarán" : esc(NOMBRE) + " te contestará"} lo antes posible.</p></div>
    <div class="card"><ol class="nx"><li><span>Si no se abrió ${S.canal === "wa" ? "WhatsApp" : "el correo"}, vuelve a pulsar:<br><a class="link" style="display:inline-flex;align-items:center;gap:8px;padding:0;margin-top:4px" data-send="${S.canal || "mail"}" href="${esc(S.canal === "wa" ? urlWa() : urlMail())}" ${S.canal === "wa" ? 'target="_blank" rel="noopener"' : ""}>${S.canal === "wa" ? I.wa : I.mail}Abrir de nuevo el mensaje</a></span></li>
    <li><span>Si quieres, envía también el archivo con los datos: ${GENERICA ? "el despacho" : esc(NOMBRE)} lo carga en su programa y no tendrás que repetir nada.<br><button type="button" class="btn ghost" style="margin-top:10px;min-height:48px;font-size:15.5px" data-act="archivo">${I.file}Guardar el archivo</button></span></li></ol></div>`;
}

// ───────── Mensajes y archivo para el despacho ─────────
const telWa = (t) => { let d = String(t || "").replace(/[^\d+]/g, ""); if (d.startsWith("+")) d = d.slice(1); else if (d.startsWith("00")) d = d.slice(2); else if (/^[6789]\d{8}$/.test(d)) d = "34" + d; return /^\d{8,15}$/.test(d) ? d : ""; };
const horaTxt = () => (HORAS.find(([v]) => v === S.contacto.hora) || [, ""])[1];
function herederosTxt() {
  const n = (c, s, p) => (c ? plural(c, s, p) : ""), L = [];
  if (casado()) L.push("viudo o viuda"); if (conPareja()) L.push(S.parejaInscrita === "si" ? "pareja de hecho inscrita" : "pareja de hecho");
  L.push(n(S.hijos.length, "hijo", "hijos")); if (!S.hijos.length) { if (S.padres) L.push(S.padres === 2 ? "padre y madre" : "padre o madre"); else { L.push(n(S.hermanos, "hermano", "hermanos")); L.push(n(S.sobrinos, "sobrino", "sobrinos")); } }
  if (S.testamento === "si") L.push(n(S.otros, "otra persona", "otras personas"));
  return L.filter(Boolean).join(", ");
}
function urlWa() { const t = telWa(D.tel); if (!t) return ""; return `https://wa.me/${t}?text=${encodeURIComponent(textoCorto())}`; }
function urlMail() { const to = mailOk(D.email) ? D.email : ""; if (!to && !GENERICA && telWa(D.tel)) return ""; return `mailto:${to}?subject=${encodeURIComponent(asunto())}&body=${encodeURIComponent(textoLargo())}`; }
const asunto = () => `Consulta de herencia desde la calculadora${S.contacto.nombre ? " · " + S.contacto.nombre.trim() : ""}`;
function textoCorto() {
  const R = resultado(), k = S.contacto, tot = R && R.isd ? R.isd.total : 0;
  return [`Hola${GENERICA ? "" : ", " + NOMBRE}. Soy ${k.nombre.trim()}. He hecho el cálculo de una herencia en la calculadora de vuestra web y me gustaría que lo revisarais.`,
    `· ${S.municipio ? S.municipio + ", " : ""}${terrNombre(S.ccaa)}. Fallecimiento el ${fechaCorta(S.fecha)}`,
    `· ${S.testamento === "si" ? "Con testamento" : S.testamento === "no" ? "Sin testamento" : "No sabemos si hay testamento"}. Herederos: ${herederosTxt()}`,
    `· Bienes: ${eur0(totalBienes())}${totalDeudas() ? " · Deudas y gastos: " + eur0(totalDeudas()) : ""}`,
    `· Impuesto estimado: ${eur(tot)}`,
    [telOk(k.tel) ? "Mi teléfono: " + k.tel.trim() : "", mailOk(k.email) ? "Correo: " + k.email.trim() : "", horaTxt() ? "Mejor hora: " + horaTxt().toLowerCase() : ""].filter(Boolean).join(" · ")].join("\n");
}
function textoLargo() {
  const R = resultado(), k = S.contacto; const isd = R && R.isd;
  const pl = R && R.plazos ? R.plazos.find((q) => q.id === "isd") : null;
  return [`Hola${GENERICA ? "" : ", " + NOMBRE}:`, "", "He usado la calculadora de herencias de vuestra web y me gustaría que revisarais el caso.", "",
    "CONTACTO", `Nombre: ${k.nombre.trim()}`, telOk(k.tel) ? `Teléfono: ${k.tel.trim()}` : "", mailOk(k.email) ? `Correo: ${k.email.trim()}` : "", horaTxt() ? `Mejor hora: ${horaTxt().toLowerCase()}` : "", "",
    "DATOS DEL CASO", `Residencia: ${terrNombre(S.ccaa)}${S.municipio ? " · " + S.municipio : ""}`, `Fecha del fallecimiento: ${fechaLarga(S.fecha)}`, `Testamento: ${({ si: "sí", no: "no", nose: "no lo sabemos" })[S.testamento] || "-"}`, `Estado civil: ${({ gananciales: "casado o casada en gananciales", separacion: "casado o casada en separación de bienes", pareja: "pareja de hecho", viudo: "viudo o viuda", soltero: "soltero, soltera o divorciado" })[S.civil] || "-"}`, `Herederos: ${herederosTxt()}`,
    `Bienes: ${BIENES.filter(([b]) => num(S.bienes[b]) > 0).map(([b]) => `${DESC_BIEN[b].toLowerCase()} ${eur0(num(S.bienes[b]))}`).join("; ")}${S.civil === "gananciales" ? (S.ganancial ? " (gananciales)" : " (privativos)") : ""}`,
    totalDeudas() ? `Deudas y gastos: ${DEUDAS.filter(([d]) => num(S.deudas[d]) > 0).map(([d, t]) => `${t.toLowerCase()} ${eur0(num(S.deudas[d]))}`).join("; ")}` : "", "",
    isd ? "ESTIMACIÓN DEL IMPUESTO SOBRE SUCESIONES" : "", ...(isd ? isd.herederos.map((h) => `${h.nombre}: recibe ${eur(h.valorAdquirido)} y pagaría ${eur(h.aIngresar)}`) : []), isd ? `Total: ${eur(isd.total)} (${isd.territorio})` : "", pl ? `Plazo: ${fechaLarga(pl.limite)}` : "", "",
    k.obs.trim() ? "COMENTARIOS\n" + k.obs.trim() + "\n" : "",
    `He aceptado la política de privacidad el ${new Date().toLocaleString("es-ES")}.`, "Si os sirve, os envío también el archivo con los datos (.hereda.json) para cargarlo en Hereda+."].filter((l, i, a) => l !== "" || a[i - 1] !== "").join("\n");
}
function salida() {
  const R = resultado(), x = R.x, k = S.contacto, isd = R.isd;
  return {
    app: "hereda+", tipo: "familia", origen: "calculadora", version: 1, ref: "", despacho: D.nombre || "", enviado: new Date().toISOString(),
    causante: { nombre: "", fecha: S.fecha, ccaa: S.ccaa, municipio: S.municipio || "", civil: S.civil, testamento: S.testamento },
    personas: x.personas.map((p) => ({ nombre: p.nombre, relacion: p.relacion, edad: p.edad === "" || p.edad == null ? "" : num(p.edad), convivia: !!p.convivio2anios, discapacidad: 0, inscrita: !!p.inscrita })),
    bienes: x.bienes.map((b) => ({ tipo: b.tipo, descripcion: b.descripcion, municipio: b.tipo === "vivienda" ? S.municipio || "" : "", valor: b.valor, titularidad: b.titularidad, porcentaje: "" })),
    deudas: { hipoteca: num(S.deudas.hipoteca), otras: num(S.deudas.otras), funeral: num(S.deudas.funeral), seguros: "" },
    documentos: [], contacto: { nombre: k.nombre.trim(), relacion: "", tel: k.tel.trim(), email: k.email.trim(), hora: horaTxt() },
    observaciones: [`Consulta recibida desde la calculadora de la web el ${fechaLarga(hoy())}.`, horaTxt() ? `Mejor hora para llamar: ${horaTxt().toLowerCase()}.` : "", k.obs.trim(), "Supuestos del cálculo: " + supuestos(R).join(" "), S.testamento === "si" ? `Dicen que hay testamento; la calculadora supuso ${x.testamento === "usufructo" ? "usufructo universal para el cónyuge y nuda propiedad para los hijos" : "reparto a partes iguales"}.` : "", conPareja() ? `Pareja de hecho ${S.parejaInscrita === "si" ? "inscrita" : S.parejaInscrita === "no" ? "no inscrita" : "(no saben si está inscrita)"}.` : "", `Estimación de la calculadora: ${isd.herederos.map((h) => `${h.nombre} ${eur(h.aIngresar)}`).join("; ")}. Total ${eur(isd.total)}.`].filter(Boolean).join("\n"),
    consentimiento: !!S.ok,
    calculadora: { motor: typeof VERSION !== "undefined" ? VERSION : "", territorio: isd.territorio, reparto: x.testamento, total: isd.total, herederos: isd.herederos.map((h) => ({ nombre: h.nombre, relacion: h.relacion, valorAdquirido: h.valorAdquirido, aIngresar: h.aIngresar })) },
  };
}
const nombreArchivo = () => `Herencia ${(S.contacto.nombre || "").trim() || "consulta"} - datos de la familia.hereda.json`.normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/[^\x20-\x7E]/g, "").replace(/[\\/:*?"<>|]/g, "");
async function guardarArchivo() {
  const f = new File([JSON.stringify(salida(), null, 1)], nombreArchivo(), { type: "application/json" });
  try { if (navigator.canShare && navigator.canShare({ files: [f] }) && /Android|iPhone|iPad/i.test(navigator.userAgent)) { await navigator.share({ files: [f], title: "Datos de la herencia" }); return; } } catch (e) { if (e && e.name === "AbortError") return; }
  const a = document.createElement("a"); a.href = URL.createObjectURL(f); a.download = f.name; document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1500);
}

// ───────── Navegación y eventos ─────────
function irA(n) { S.paso = n; save(); vista(); if (!EMB) window.scrollTo(0, 0); else avisar({ hereda: "arriba" }); document.querySelector("#app h1")?.focus({ preventScroll: true }); }
function avisar(m) { try { if (EMB) window.parent.postMessage(m, "*"); } catch (e) {} }
let hAnt = 0;
function altura() { if (!EMB) return; requestAnimationFrame(() => { const h = Math.ceil(document.body.getBoundingClientRect().height); if (Math.abs(h - hAnt) > 2) { hAnt = h; avisar({ hereda: "altura", h }); } }); }
if (EMB && "ResizeObserver" in window) new ResizeObserver(altura).observe(document.body);
function set(path, val) {
  const [a, b] = path.split(".");
  if (a === "b") S.bienes[b] = numIn(val); else if (a === "d") S.deudas[b] = numIn(val); else if (a === "k") S.contacto[b] = val; else S[a] = val;
  save();
}
function refrescarNecesario(p) { const n = document.getElementById("need"), err = valido(p), btn = document.querySelector("[data-next]"); if (btn) { if (err) btn.setAttribute("aria-disabled", "true"); else btn.removeAttribute("aria-disabled"); } if (n && (!err || touched[p])) n.textContent = touched[p] ? err : ""; }
function refrescarEnvio() {
  const err = valido(7), e = document.getElementById("err"); if (e) e.textContent = touched[7] && err ? err : "";
  document.querySelectorAll("#send [data-send]").forEach((el) => { const u = el.dataset.send === "wa" ? urlWa() : urlMail(); if (err) { el.setAttribute("aria-disabled", "true"); el.setAttribute("href", "#"); } else { el.removeAttribute("aria-disabled"); el.setAttribute("href", u); } });
}
function totales() { const t = document.getElementById("tot"); if (t) t.textContent = eur0(totalBienes()); refrescarNecesario(5); }
function sugerencias(q) {
  const ul = document.getElementById("sug"), inp = document.getElementById("f-muni"); if (!ul) return;
  const L = buscar(q); ul.hidden = !L.length; inp.setAttribute("aria-expanded", L.length ? "true" : "false");
  ul.innerHTML = L.map((m, i) => `<li role="option"><button type="button" data-muni="${i}" data-n="${esc(m.n)}" data-p="${esc(m.pn)}" data-c="${esc(m.ccaa)}"><span>${esc(m.n)}</span><small>${esc(m.pn)} · ${esc(terrNombre(m.ccaa))}</small></button></li>`).join("");
}
document.addEventListener("click", (e) => {
  const t = e.target.closest("[data-go],[data-next],[data-o],[data-st],[data-act],[data-muni],[data-send]"); if (!t) return;
  const d = t.dataset;
  if (d.send != null) {
    if (t.getAttribute("aria-disabled") === "true") { e.preventDefault(); touched[7] = true; refrescarEnvio(); return; }
    S.canal = d.send; save(); if (S.paso !== 8) setTimeout(() => irA(8), 60); return;
  }
  if (d.go != null) { if (GENERICA && Number(d.go) > 6) return; irA(Number(d.go)); return; }
  if (d.next != null) { const p = Number(d.next), err = valido(p); if (err) { touched[p] = true; refrescarNecesario(p); return; } irA(p + 1); return; }
  if (d.o) {
    if (d.o === "test") S.testamento = d.v; else if (d.o === "civil") { S.civil = d.v; if (d.v === "separacion" || d.v === "gananciales") S.ganancial = d.v === "gananciales"; }
    else if (d.o === "inscrita") S.parejaInscrita = d.v; else if (d.o === "hora") S.contacto.hora = d.v;
    save(); if (S.paso === 7) { document.querySelectorAll('[data-o="hora"]').forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.v === d.v))); refrescarEnvio(); } else vista(); return;
  }
  if (d.st) {
    const dl = Number(d.d), k = d.st;
    if (k === "cony") S.conyEdad = Math.min(105, Math.max(18, S.conyEdad + dl));
    else if (k === "hijos") { if (dl > 0 && S.hijos.length < 10) S.hijos.push(21); if (dl < 0) S.hijos.pop(); }
    else if (k.startsWith("hijo:")) { const i = Number(k.slice(5)); S.hijos[i] = Math.min(21, Math.max(0, S.hijos[i] + dl)); }
    else { const max = k === "padres" ? 2 : k === "otros" ? 6 : 10; S[k] = Math.min(max, Math.max(0, (S[k] || 0) + dl)); }
    save(); vista(); return;
  }
  if (d.muni != null) { S.municipio = `${d.n} (${d.p})`; S.ccaa = d.c; S.muniCcaa = d.c; save(); vista(); document.getElementById("f-ccaa")?.focus({ preventScroll: true }); return; }
  if (d.act === "sinmuni") { S.municipio = ""; save(); vista(); document.getElementById("f-muni")?.focus(); return; }
  if (d.act === "reiniciar") { const c = S.contacto; S = nuevo(); S.contacto = c; cache.k = ""; irA(1); return; }
  if (d.act === "archivo") { guardarArchivo(); return; }
  if (d.act === "barras") { S.barras = !S.barras; save(); vista(); return; }
  if (d.act === "imprimir") { try { window.print(); } catch (er) {} return; }
});
document.addEventListener("input", (e) => {
  const t = e.target;
  if (t.dataset.h === "muni") { sugerencias(t.value); return; }
  if (t.dataset.r) { const c = curva(Number(t.dataset.max)), v = c.b(Number(t.value), Number(t.dataset.step)); t.style.setProperty("--p", t.value / 10 + "%"); t.setAttribute("aria-valuetext", eur0(v)); set(t.dataset.r, v); const inp = document.querySelector(`[data-k="${t.dataset.r}"]`); if (inp) inp.value = fmtIn(v); totales(); return; }
  if (!t.dataset.k) return;
  const val = t.type === "checkbox" ? t.checked : t.value;
  set(t.dataset.k, val);
  if (t.dataset.eur) { const r = document.querySelector(`[data-r="${t.dataset.k}"]`); if (r) { const m = Number(r.dataset.max), tv = curva(m).a(numIn(t.value)); r.value = tv; r.style.setProperty("--p", tv / 10 + "%"); } totales(); return; }
  if (t.dataset.k === "fecha") { if (S.fecha) touched[2] = true; const pl = document.getElementById("plz"); if (pl) pl.innerHTML = S.fecha && S.fecha <= hoy() && S.fecha >= "1990-01-01" ? `Plazo para el Impuesto sobre Sucesiones: hasta el <b>${fechaLarga(calcularPlazos(S.fecha, {}).find((q) => q.id === "isd").limite)}</b>.` : ""; refrescarNecesario(2); return; }
  if (S.paso === 7) refrescarEnvio();
});
document.addEventListener("change", (e) => {
  const t = e.target; if (!t.dataset.k) return;
  if (t.dataset.eur) t.value = fmtIn(t.value);
  if (t.dataset.k === "ccaa") { set("ccaa", t.value); if (S.municipio && S.muniCcaa !== t.value) { S.municipio = ""; save(); vista(); document.getElementById("f-ccaa")?.focus({ preventScroll: true }); } refrescarNecesario(1); return; }
  if (t.dataset.k === "ganancial") { set("ganancial", t.checked); return; }
  if (t.dataset.k === "deudaGan") { set("deudaGan", t.checked); return; }
  if (t.dataset.k === "ok") { set("ok", t.checked); refrescarEnvio(); }
});
document.addEventListener("keydown", (e) => {
  if (e.target.dataset && e.target.dataset.h === "muni" && e.key === "Enter") { e.preventDefault(); document.querySelector("#sug button")?.click(); }
  if (e.target.dataset && e.target.dataset.h === "muni" && e.key === "ArrowDown") { e.preventDefault(); document.querySelector("#sug button")?.focus(); }
});
window.HeredaCalc = { estado: () => S, expediente, caso: () => casoMotor(expediente()), resultado, salida, urlWa, urlMail, irA, despacho: D };
vista();
})();
</script>
